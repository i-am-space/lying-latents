# Operational config. Values here are bound by config/preregistration.yaml;
# any divergence is a pre-registration violation and must be justified in a commit.
master_seed: 20260904

data:
  dataset: glue
  dataset_config: sst2
  split: train
  text_column: sentence
  label_column: label
  max_samples: null          # null = full split

model:
  name: google/gemma-2-2b
  dtype: float32
  layer: 20
  attn_implementation: eager
  batch_size: 64
  max_seq_len: 128

sae:
  release: gemma-scope-2b-pt-res-canonical
  sae_id: layer_20/width_16k/canonical

aggregation:
  primary: mean
  cached: [mean, max, last]

latent_filter:
  min_firing_rate: 0.01
  max_retained: 2048

covariance:
  ill_conditioned_cond_number: 10000.0
  standardise: true

knockoffs:
  s_method: equicorrelated
  sample_tol: 1.0e-05

# computational parameters added after pre-registration (see commit message
# and results/stage2_findings.md "Deviations"). These control cost only; they do
# not alter any decision rule, and the |S|=0 negative control is subject to the
# identical treatment, so they cannot manufacture a positive result.
diagnostics:
  swap_sizes: [0, 1, 10, 50, all]
  classifier_max_iter: 100
  holdout_fraction: 0.3
  n_label_permutations: 20
  mmd_subsample: 2000
  mmd_permutations: 500
  n_clf_rows: 20000        # rows fed to the two-sample classifier (cost cap)
  swap_replicates: 3       # independent draws of S for |S| in {1, 10, 50}
  synthetic_n_rows: 20000
  synthetic_replicates: 10

stage1:
  n_permutations: 500
  scoring_methods: [mean_diff, auroc, probe_weight]
  top_k_certify: 10
  ablation_delta: 0.02
  probe_holdout_fraction: 0.3
  probe_max_iter: 200
  probe_C: 1.0
  probe_lr: 0.1                 # was hard-coded in fit_probe_gpu; value unchanged
  naive_alpha: 0.05             # per-latent uncorrected threshold a practitioner would use
  wy_alpha: 0.05
  behaviour_thresholds: [0.005, 0.01, 0.02, 0.05, 0.10, 0.15, 0.20]   # tau grid for FWER(tau) curves
  planted_check:                # power check: the certification step must fire on a known signal
    replicates: 10
    k: 10
    amplitude: 3.0
    form: linear
    min_detect_fraction: 0.8

# Stage 1, validate step (config/preregistration.yaml stage1_amendment_2). Probe, scoring
# methods and split fraction are taken from the stage1 block above, so the probe is identical.
stage1_validate:
  n_permutations: 500
  top_k: 10
  alpha: 0.05                   # one-sided paired test of "ablation raises the probe's log-loss"
  loss: log_loss
  primary_variant: joint        # all top_k ablated together; per-latent variants are secondary
  planted_check:
    replicates: 20
    k: 10
    amplitudes: [3.0, 1.0]      # 3.0 is the gate; 1.0 is descriptive
    gate_amplitude: 3.0
    min_detect_fraction: 0.8
    form: linear

stage3:
  signal_sizes: [10, 20, 30]
  nominal_fdr_targets: [0.05, 0.10, 0.20]
  replicates: 10
  functional_forms: [linear, interaction]
  signal_amplitudes: [0.5, 1.0, 2.0, 3.0]   # amplitude sweep: tests the failure boundary
  knockoff_redraws: 3                         # independent knockoff generations for honest SEs
  lasso_lambda: 0.02
  lasso_max_iter: 500
  lasso_lr: 0.1
  n_samples: 20000          # computational subsample for fast multi-replicate fitting

# Stage 3 v2 (config/preregistration.yaml stage3_amendment_1): fair test of the zero atom.
stage3_v2:
  p: 512                        # MVR converges at 512, not 2048 (Stage 2); proposal sec. 7: top few hundred
  n_rows: 20000
  latent_subset: random         # seeded random subset of the retained latents (representative zero mass)
  signal_sizes: [10, 20, 30]
  nominal_fdr_targets: [0.05, 0.10, 0.20]
  functional_forms: [linear, interaction]
  signal_amplitudes: [0.5, 1.0, 2.0, 3.0, 5.0, 8.0]   # extended past 3.0 to look for the failure boundary
  replicates: 30                # independent: fresh knockoff draw per replicate
  datasets: [real_mvr, real_equi, gauss_mvr]
  lasso:
    lambda: 0.02
    max_iter: 1000
    tol: 1.0e-4                 # proximal-gradient residual; non-convergence is reported
    lambda_sensitivity: [0.01, 0.05]
    sensitivity_amplitude: 2.0
  wy_baseline:
    n_permutations: 200
  null_harness:
    replicates: 50              # k = 0: no signal at all
  diagnose:
    pilot_replicates: 10

# Stage 3 p2048 follow-up (config/preregistration.yaml stage3_amendment_2): why did v1 see a
# power collapse that v2 (p = 512) does not? Changes one thing at a time at v1's p = 2048.
stage3_p2048:
  p: 2048
  n_rows: 20000
  covariance: ledoit_wolf       # v1's estimator
  s_method: equicorrelated      # v1's S (MVR does not converge at p = 2048)
  signal_amplitudes: [0.5, 1.0] # where v1 reported the collapse
  functional_forms: [linear, interaction]
  signal_sizes: [10, 20, 30]
  nominal_fdr_targets: [0.05, 0.10, 0.20]
  replicates: 30                # replicate r uses knockoff draw r of its dataset in every cell
  lasso:                        # the fixed solver (v2's): step 1/L, convergence checked
    lambda: 0.02
    max_iter: 1000
    tol: 1.0e-4
  v1_solver:                    # v1's solver, verbatim: fixed step, fixed iterations, no check
    lr: 0.1
    max_iter: 500
  arms:                         # [name, dataset, solver]
    - [v1_setup, real_first, v1]
    - [first_fixed, real_first, fixed]
    - [random_fixed, real_random, fixed]
    - [gauss_fixed, gauss, fixed]
    - [gauss_v1, gauss, v1]
  contrasts:                    # [name, a, b]: a - b, paired over replicates
    - [solver, first_fixed, v1_setup]
    - [rows, random_fixed, first_fixed]
    - [zero_atom, gauss_fixed, random_fixed]
    - [solver_without_atom, gauss_fixed, gauss_v1]
  v1_arm: v1_setup
  v1_reference: results/stage3_planted_fdr.json
  diagnose:
    pilot_replicates: 3
    pilot_cell: [0.5, linear, 20]

# Stage 4 (config/preregistration.yaml stage4_amendment_1): hurdle vs Gaussian knockoffs,
# paired on identical data, draws and labels, in the Stage 3 p2048 setting where the zero atom
# costs power (rows, p, covariance and S method are taken from the stage3_p2048 block).
stage4:
  base: stage3_p2048
  signal_amplitudes: [0.5, 1.0, 3.0]   # 0.5/1.0: where the atom costs power; 3.0: FDR stress
  functional_forms: [linear, interaction]
  signal_sizes: [10, 20, 30]
  nominal_fdr_targets: [0.05, 0.10, 0.20]
  replicates: 30                       # replicate r uses knockoff draw r of its arm in every cell
  lasso:
    lambda: 0.02
    max_iter: 1000
    tol: 1.0e-4
  hurdle:
    s_method: equicorrelated           # same S method as the Gaussian arm (MVR does not converge at p = 2048)
    covariance: ledoit_wolf
    positive_tail: empirical
  arms:                                # [name, data, knockoffs]
    - [gauss_real, real_random, gaussian]
    - [hurdle_real, real_random, hurdle]
    - [gauss_ceiling, gauss, gaussian]
  contrasts:                           # [name, a, b]: a - b, paired over replicates
    - [hurdle_gain, hurdle_real, gauss_real]
    - [atom_gap, gauss_ceiling, gauss_real]
  exchangeability:
    swap_sizes: [0, 50, all]
    swap_replicates: 1
  diagnose:
    pilot_replicates: 2
    pilot_cell: [0.5, linear, 20]

# Stage 4 as specified in the proposal (config/preregistration.yaml stage4_amendment_2): hurdle
# knockoffs by sequential conditional independent pairs (SCIP), binarised knockoffs, and e-value
# sample splitting, against the Gaussian baseline and the no-atom Gaussian control.
stage4_repairs:
  p: 2048                       # all retained latents (the server run); p < 2048 = seeded random subset
  n_rows: 20000                 # the Stage 3 p2048 rows (stream s3p2048_data)
  covariance: ledoit_wolf
  s_method: equicorrelated      # Gaussian baseline S (MVR does not converge at p = 2048)
  signal_amplitudes: [0.5, 1.0, 3.0]
  functional_forms: [linear, interaction]
  signal_sizes: [10, 20, 30]
  nominal_fdr_targets: [0.05, 0.10, 0.20]
  replicates: 30
  lasso:
    lambda: 0.02
    max_iter: 1000
    tol: 1.0e-4
  scip:
    order: natural              # latents are sampled in index order
    covariates: log1p_standardised   # log1p(x) standardised with the real data's moments, for x and x~ alike
    logistic_ridge: 1.0e-3      # on the mean log-loss
    positive_ridge: 1.0e-1      # on the mean squared error of log x
    newton_max_iter: 25
    newton_tol: 1.0e-6
  evalue:
    split_fraction: 0.5
    selection_lambda: 0.02
    max_selected: 500
    refit_ridge: 1.0e-6
    calibrator_kappa: 0.5       # e = kappa * p^(kappa - 1)
  arms:                         # [name, method]
    - [gauss_real, gaussian]
    - [hurdle, hurdle_scip]
    - [binarised, binary_scip]
    - [evalue, evalue_split]
    - [gauss_ceiling, gaussian_control]
  contrasts:                    # [name, a, b]: a - b, paired over replicates
    - [hurdle_gain, hurdle, gauss_real]
    - [binarised_gain, binarised, gauss_real]
    - [evalue_gain, evalue, gauss_real]
    - [atom_gap, gauss_ceiling, gauss_real]
  exchangeability:
    swap_sizes: [0, 50, all]
    swap_replicates: 1
  diagnose:
    pilot_replicates: 1
    pilot_cell: [1.0, linear, 20]

paths:
  cache_dir: data/cache
  results_dir: results


