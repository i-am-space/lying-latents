# PRE-REGISTRATION — Stage 2 exchangeability audit
#
# Frozen before any experiment was run. Committed as its own commit so the git
# timestamp precedes the first results commit. Every threshold, seed and decision
# rule below was fixed in advance. If any of it is changed later, the change must
# be a separate commit with a stated reason, and the original must remain in history.
#
# The paper's thesis is that the field selects on its own results. This file is the
# evidence that we did not.

meta:
  stage: 2
  date_registered: "2026-09-04"
  scope: >
    Activation cache, distributional summary, Gaussian second-order knockoff
    generation, exchangeability diagnostics with a validated null harness.
    Stages 1, 3, 4 and 5 are out of scope and are not built.

# ---------------------------------------------------------------------------
# Seeds
# ---------------------------------------------------------------------------
seeds:
  master: 20260904
  # Per-component streams are derived deterministically from the master seed via
  # numpy.random.SeedSequence(master).spawn(), in this fixed order. Do not reorder.
  streams:
    - dataset_order      # 0
    - torch_global       # 1
    - knockoff_sampler   # 2
    - row_partition      # 3
    - classifier         # 4
    - mmd_permutation    # 5
    - synthetic_null     # 6

# ---------------------------------------------------------------------------
# Data / model / SAE  (verified to resolve before registration)
# ---------------------------------------------------------------------------
data:
  dataset: glue
  dataset_config: sst2
  split: train
  n_expected: 67349          # full split, no subsampling
  text_column: sentence
  label_column: label

model:
  name: google/gemma-2-2b
  dtype: float32
  layer: 20
  hook: resid_post           # HF hidden_states[layer+1]
  attn_implementation: eager # required for correct Gemma-2 logit soft-capping

sae:
  release: gemma-scope-2b-pt-res-canonical
  sae_id: layer_20/width_16k/canonical
  d_sae: 16384
  architecture: jumprelu

# ---------------------------------------------------------------------------
# Aggregation  (see NOTES_reference.md §2 and §7)
# ---------------------------------------------------------------------------
aggregation:
  primary: mean
  cached:
    - mean          # mean over non-special tokens
    - max           # max over non-special tokens
    - last          # last non-special token (defensible analogue of the reference)
  exclude_tokens: [pad, bos, eos]
  rationale: >
    The build instructions make max primary only if the reference uses max. It does
    not: it takes position -1 of a right-padded batch, which is a pad token for most
    rows (verified, NOTES_reference.md §2.1). Mean therefore stays primary. `last` is
    cached so their intended aggregator can be reported separately from their padding
    bug. The reference's literal [:, -1, :] is not reproduced.

# ---------------------------------------------------------------------------
# High-activity latent filter
# ---------------------------------------------------------------------------
latent_filter:
  statistic: firing_rate       # Pr(X_j > 0) across the corpus
  min_firing_rate: 0.01
  max_retained: 2048           # top-p by firing rate if more survive
  applied_on: primary_aggregator
  note: >
    The reference instead takes top-1024 by mean |activation| ("energy"). That
    statistic is recorded per latent so the two selections can be compared, but it
    is not used for selection here.

# ---------------------------------------------------------------------------
# DECISION RULE 1 — premise check (Deliverable 2)
# ---------------------------------------------------------------------------
# Evaluated on median_j Pr(X_j = 0) over RETAINED latents, exact zeros only,
# under the PRIMARY aggregator. Reported for every aggregator regardless.
premise_check:
  statistic: median_zero_mass_retained_primary
  rules:
    - if: ">= 0.80"
      verdict: PREMISE_HOLDS
      action: proceed to the exchangeability audit as specified
    - if: "0.50 <= x < 0.80"
      verdict: PREMISE_WEAKENED
      action: >
        proceed, but the writeup must state that the atom argument rests on a
        smaller atom than the >0.95 figure claimed in the proposal, and must report
        the realised value in place of that claim.
    - if: "< 0.50"
      verdict: PREMISE_FAILS
      action: >
        stop. Report the number. The atom argument needs rewriting around the
        aggregator before any further work is committed.

# ---------------------------------------------------------------------------
# DECISION RULE 2 — covariance conditioning
# ---------------------------------------------------------------------------
covariance:
  estimators: [sample, ledoit_wolf]   # both always reported
  ill_conditioned_if_cond_number_above: 10000.0
  primary_selection_rule: >
    If cond(sample covariance of standardised columns) > 1e4, ledoit_wolf is primary
    and sample is reported alongside. Otherwise sample is primary.
  standardise_columns_before_construction: true
  also_run_unstandardised: true       # exposes the reference's scale confound

# ---------------------------------------------------------------------------
# Knockoff construction
# ---------------------------------------------------------------------------
knockoffs:
  library: knockpy
  sampler: knockpy.knockoffs.GaussianSampler
  s_method_primary: equicorrelated    # matches the reference's scalar-s construction
  s_method_secondary: mvr
  sample_tol: 1.0e-05

# ---------------------------------------------------------------------------
# DECISION RULE 3 — harness validation (§7.2). Runs BEFORE the real diagnostics.
# ---------------------------------------------------------------------------
# Synthetic data: multivariate Gaussian with the SAME covariance as the real
# retained latents. Second-order knockoffs are exactly valid there, so every
# diagnostic must return null. If any fires, the harness is broken.
synthetic_null:
  n_rows: 20000
  n_replicates: 10
  pass_criteria:
    classifier_auc_ci95_must_contain: 0.50
    mmd_pvalue_uniformity_ks_test_p_min: 0.05   # KS test of the 10 p-values vs U(0,1)
    max_abs_standardised_moment_gap: 0.10
  on_failure: >
    Fix the harness. Do not run the real diagnostics. A diagnostic that fires on
    exactly-valid Gaussian knockoffs would produce a result that looks like a
    finding and is not.

# ---------------------------------------------------------------------------
# Diagnostics (§7.3)
# ---------------------------------------------------------------------------
diagnostics:
  # (a) zero-mass discrepancy — the trivial classifier 1{x = 0}
  zero_mass:
    expected_under_exchangeability: 0.50
    report: distribution across retained latents

  # (b) swap two-sample tests
  swap:
    subset_sizes: [0, 1, 10, 50, "all"]   # |S| = 0 is the built-in negative control
    row_partition: 0.5                     # half unswapped, half swapped
    classifier:
      model: sklearn.ensemble.HistGradientBoostingClassifier
      max_iter: 100
      holdout_fraction: 0.3
      null_band_from: label_permutation
      n_permutations: 20
    mmd:
      kernel: gaussian
      bandwidth: median_heuristic
      subsample_per_group: 2000
      n_permutations: 500

  # (c) higher moments and tails
  moments:
    must_match: [mean, variance]           # matched by construction; if not, misconfigured
    match_tolerance_relative: 0.05
    compared: [skewness, kurtosis, q90, q99, q999, max]

# ---------------------------------------------------------------------------
# DECISION RULE 4 — what counts as a violation
# ---------------------------------------------------------------------------
violation_criteria:
  zero_mass: "median per-latent accuracy of 1{x=0} > 0.55"
  swap_auc: "held-out AUC exceeds the |S|=0 null band's 97.5th percentile"
  moments: "skewness or kurtosis gap exceeds the synthetic-null gap by >5x"

# ---------------------------------------------------------------------------
# Interpretation constraints — fixed in advance, must survive into the paper
# ---------------------------------------------------------------------------
interpretation_constraints:
  - >
    The null set is unknown on real data. Exchangeability is only REQUIRED on nulls.
    These are therefore necessary-condition tests: sufficient to falsify, not to
    confirm. We may not claim to have "confirmed the violation on nulls".
  - >
    A violation of exchangeability VOIDS the guarantee. It does not demonstrate that
    realised FDR exceeds the target. That is Stage 3 and is out of scope. No
    conclusion may assert demonstrated FDR inflation from Stage 2 evidence.
  - >
    The zero-mass diagnostic is deliberately the simplest possible falsification. Its
    force is that it needs no test at all, only the definition. It must not be
    oversold as a sophisticated finding.
  - >
    The reference's padding bug and its unstandardised scalar-s covariance scaling are
    defects of that implementation. They are reported SEPARATELY from the zero-atom
    argument, which is a defect of the Gaussian surrogate itself and would survive a
    correct implementation.

# ===========================================================================
# PRE-REGISTRATION — Stage 1 FWER calibration
# ===========================================================================
# Appended to the same pre-registration file. All Stage 2 rules above are
# unchanged. This block must be committed before any Stage 1 results.

stage1:
  meta:
    date_registered: "2026-09-10"
    scope: >
      FWER calibration of the standard search-then-validate pipeline under the
      global null (label permutation). Reuses the Stage 2 activation cache;
      no new GPU work. All analysis is CPU-bound.

  seeds:
    stream: label_permutation   # index 7 in STREAMS (appended, preserving 0-6)

  n_permutations: 500

  scoring_methods:
    mean_diff:
      definition: "|mean(X_j | y=1) - mean(X_j | y=0)| on the train split"
    auroc:
      definition: >
        |AUC(y, X_j) - 0.5| on the train split, computed via the rank-sum
        (Mann-Whitney U) formula. Ties broken by stable sort order.
    probe_weight:
      definition: >
        |β_j| from L1-logistic regression on all retained latents, train split.
        Columns standardised (zero mean, unit variance) before fitting.

  selection:
    top_k: 10
    note: >
      Top-10 matches a realistic practitioner use case (pick a handful of
      candidates). The scoring method determines the ranking.

  validation:
    method: latent_zeroing
    description: >
      Zero the candidate latent's column in X_test, re-evaluate the logistic
      probe's held-out accuracy. If accuracy drops by >= delta, the latent is
      "certified" (passes the search-then-validate workflow).
    ablation_delta: 0.02
    note: >
      This is a latent-space proxy for model-level ablation. True model-level
      ablation would require a forward pass per candidate per permutation
      (500 * k = 5000 GPU forward passes), which is out of scope. The proxy
      is faithful to the logic of the standard pipeline: a latent is certified
      iff it both ranks highly AND zeroing it changes predictions.
    probe:
      penalty: l1
      solver: saga
      C: 1.0
      max_iter: 200
    holdout_fraction: 0.3

  fwer_definition: >
    Fraction of B permutations in which at least one latent is certified.
    Reported separately for each scoring method.

  westfall_young:
    description: >
      The permutation null distribution of max_j score(j, y_π) across all B
      permutations. Single-step Westfall-Young correction. Per-latent adjusted
      p-values: p_j = (1 + #{b : max_null_b >= real_score_j}) / (1 + B).
    alpha: [0.05, 0.01]

  interpretation_constraints:
    - >
      FWER under the global null measures how often the pipeline falsely
      certifies ANY feature when no feature carries signal. It is a property
      of the selection and validation procedure, not of the data.
    - >
      The Westfall-Young correction provides a multiplicity-adjusted threshold
      usable independently of the knockoff framework.
    - >
      A high FWER does not by itself prove that published feature claims are
      wrong. It shows that the pipeline does not control the error rate it
      implicitly claims to control. Analogous to demonstrating that a
      confidence interval has the wrong coverage: the parameter may still
      be in the interval, but the guarantee is void.

# ===========================================================================
# PRE-REGISTRATION — Stage 3 Realised FDR on Planted Ground Truth
# ===========================================================================
# Appended to the same pre-registration file. All Stage 1 and Stage 2 rules
# above remain unchanged. This block must be committed before Stage 3 results.

stage3:
  meta:
    date_registered: "2026-09-19"
    scope: >
      Evaluate realised False Discovery Rate (FDR) and statistical power of
      Gaussian second-order knockoffs on semi-synthetic ground truth. The real
      activation matrix X is retained (preserving exact zero-mass and correlation
      structure) while synthetic task labels Y are generated from a known subset
      S of true signals. All latents outside S are conditionally null by construction.

  seeds:
    stream: planted_signal      # index 8 in STREAMS

  signal_sizes: [10, 20, 30]
  nominal_fdr_targets: [0.05, 0.10, 0.20]
  replicates_per_condition: 20

  functional_forms:
    linear:
      description: "Logits = X_S * beta, where beta_j has random signs (+/- 1) with magnitude normalized"
    interaction:
      description: "Logits = X_S * beta + sum_{pairs} gamma_ij * X_si * X_sj with pairwise non-linear interactions"

  model_fitting:
    loss: "L1-penalised logistic regression (Lasso)"
    penalty_parameter: "cross-validated or fixed regularisation path"
    knockoff_statistic: "W_j = |beta_j| - |beta_tilde_j|"
    filter_rule: "Knockoff+ threshold (offset = 1)"

  baseline_comparison:
    method: "Westfall-Young max-statistic correction from Stage 1"
    description: "Benchmark whether assumption-free permutation testing achieves FDR control and what power it yields"

  decision_rules:
    fdr_controlled: "Mean realised FDR <= nominal target q + 1.96 * SE"
    fdr_inflated: "Mean realised FDR > nominal target q + 1.96 * SE"

  interpretation_constraints:
    - >
      Planted signal semi-synthetic benchmark isolates the effect of the
      discrete-continuous zero atom on FDR control while preserving true feature correlations.
    - >
      If realised FDR exceeds nominal q, the exchangeability violation is proven
      to cause practical harm in scientific feature discovery.
    - >
      If realised FDR tracks nominal q, the Gaussian surrogate is empirically
      robust despite mathematical misspecification.



# ===========================================================================
# AMENDMENT 1 - Stage 1 (written AFTER the v1 results; exploratory additions)
# ===========================================================================
# Appended to the same file. No earlier line is altered. Written after the v1
# Stage 1 results (commit f4f2280) had been seen, so everything below is post-hoc:
# it is disclosed as such and must not be described as pre-registered in the
# confirmatory sense. The v1 criterion and v1 numbers are retained unchanged.

stage1_amendment_1:
  meta:
    date_written: "2026-09-25"
    status: post_results_exploratory
    ordering_note: >
      This amendment was written before the v2 run but is committed together with the
      code and the v2 results in a single commit. Git history therefore does NOT show
      it preceding those results; that ordering rests on file timestamps and this
      statement only. Decision rules A1 and A2 were applied as written: the power check
      failed and the criterion was not adjusted.
    trigger: >
      v1 certified 0 of the top-10 latents on the REAL labels for all three scoring
      methods (results/stage1_calibration.json), although 141-1052 latents are
      Westfall-Young significant. A certification step that never fires on real
      signal cannot show that the false-certification rate under the null is low, and
      v1 validated on a held-out split against the permuted label, which cannot
      systematically lose accuracy by construction (that is sample-splitting, the
      remedy for the data-reuse problem the proposal describes, not the conventional
      pipeline). v1 also never measured the proposal's motivating quantity: how many
      latents pass an uncorrected per-latent test under a random label.

  record_corrections:
    - >
      stage1.meta.date_registered above reads 2026-09-10. Git history does not
      corroborate it: the stage1 block first appears in e378e1c (2026-09-17), in the
      same commit as the pipeline code, and results followed five minutes later in
      f4f2280. The date should not be relied on.
    - >
      The stage1 block above specifies an L1/SAGA probe and states the analysis is
      CPU-bound. The code committed alongside it used an L2 gradient-descent probe on
      GPU (deviation 1 in results/stage1_findings.md). The findings' claim that the
      L1 -> L2 switch "cannot bias the calibration" is withdrawn: it holds for the
      Westfall-Young max-score null, but the probe sets how strongly a single latent's
      ablation moves the predictions, so it does bear on any certification FWER. L2
      weights are dense, not sparse.

  retained_unchanged:
    - v1 scoring methods, top_k=10, delta=0.02, held-out accuracy-drop criterion
    - v1 RNG consumption (label_permutation stream), so v1 numbers must reproduce
    - >
      regression check: on re-run, FWER counts 8/6/1 of 500 (mean_diff/auroc/probe_weight),
      WY p = 0.002, WY survivors at 0.05/0.01 = 181/141, 1145/1052, 215/189, up to GPU
      float noise. A failure means the v2 code changed v1 behaviour and is a bug.

  additions:
    naive_testing:
      statistic: "Welch |t| per latent on the training split"
      thresholds: "uncorrected |t| > z(1-0.05/2); Bonferroni; Westfall-Young from the null of max|t|"
      purpose: >
        Measures the proposal's motivating claim directly: under a random label an
        uncorrected 5% scan passes about 0.05*p latents, so FWER is about 1.
    behavioural_effects:
      label_free: [flip rate of probe predictions, mean |dp|]
      label_dependent: [accuracy drop]
      variants: [best single latent among the top-k, all top-k ablated jointly]
      splits: [held_out, train]
      reporting: >
        Reported as null curves FWER(tau) with the real-label value marked, not as
        FWER at one tuned threshold: the label-free effects have a noise floor that
        depends on p and the probe, so any single threshold is arbitrary.
    same_data_variant:
      definition: >
        Same certification rule as v1 but the accuracy drop is measured on the training
        split the probe was fit to (the conventional workflow reuses its search data).
        Reported next to the pre-registered held-out FWER.
    planted_signal_check:
      generator: "Stage 3's generate_planted_labels, form linear"
      k: 10
      amplitude: 3.0
      replicates: 10
      stream: planted_signal
      pass_criterion: >
        criterion_has_power is True iff, for at least one scoring method, the v1
        certification fires (>= 1 certified in the top-10) in at least 80% of replicates.

  decision_rules:
    - id: A1
      rule: >
        FWER under an accuracy-drop certification criterion is interpreted only if
        criterion_has_power is True. Otherwise it is reported as uninformative and no
        statement about the standard pipeline's false-certification rate is made from it.
    - id: A2
      rule: >
        The planted-signal check is a sanity check on the criterion, not a tuning target.
        If it fails, the criterion is not adjusted until it passes; the failure is the
        result. Any redesign requires a further amendment.

  interpretation_constraints:
    - >
      Held-out validation against the permuted label is sample-splitting. Its low FWER
      says a split pipeline is safe, not that the conventional same-data pipeline is.
    - >
      The Westfall-Young and naive/Bonferroni results are about marginal association
      of single latents with the label. They are not conditional-independence tests.
    - >
      Behavioural change here is a change in a linear probe's predictions on cached
      latents, not in the model's generated output (unchanged from stage 1 v1).

# ===========================================================================
# AMENDMENT 2 - Stage 1 validate step (written BEFORE the code below was run)
# ===========================================================================
# Appended; no earlier line is altered. Fixes the design of a validate step that can
# detect a real effect, so the false-certification rate of the conventional
# search-then-validate workflow (proposal Sec. 5.1) can be measured. Everything here is
# fixed before the new script exists or is run.

stage1_amendment_2:
  meta:
    date_written: "2026-09-27"
    status: written_before_run
    ordering_note: >
      Intended to be committed together with the code BEFORE the real run so that git
      history shows this design preceding its results. If that did not happen, the
      results commit must say so here.
    trigger: >
      Amendment 1 found that the v1 certification criterion (zero one latent, require a
      held-out accuracy drop of at least 0.02) has no power: 0/10 certified on the real
      labels, and it fires in 10%, 50% and 50% of planted-signal replicates. Its FWER
      (0.2-1.6%) is therefore uninformative and the false-certification rate of the
      conventional workflow is still unmeasured.
    diagnosis:
      - >
        A magnitude threshold on a noisy, discrete statistic is arbitrary. The label-free
        flip rate has a null spread of up to 0.35-0.45 and the real-label value lies inside
        it, so a fixed flip-rate threshold gives FWER of 0 or 1 depending on where it is set.
      - >
        v1 validated on held-out rows, which is sample-splitting, the remedy for the
        data-reuse problem of proposal Sec. 3, not the conventional workflow.

  design:
    search_step: >
      Unchanged: score every latent (mean_diff, auroc, probe_weight) on the training split
      and take the top k = 10. The probe, its hyperparameters and the 70/30 split fraction
      are those of the stage1 block (identical code path), refit on every permutation.
    validate_step:
      statistic: >
        Per row i, d_i = logloss_i(ablated) - logloss_i(full) for the fitted probe, where
        ablating a latent sets its raw activation to 0. Log-loss is what the probe is trained on.
      test: >
        One-sided paired t-test (normal approximation; n >= 6000 rows) of mean(d) > 0, i.e.
        "ablating these latents hurts the task".
      alpha: 0.05
      certified_if: "p <= alpha"
    primary_variant:
      definition: "All top-10 candidates ablated jointly: one test per scoring method per permutation."
      rationale: "Proposal Sec. 6: take the top-k, ablate, record whether the behavioural change clears the threshold."
    secondary_variants:
      - "Each of the top-10 ablated alone; certified if any of the 10 tests has p <= 0.05 (uncorrected, common practice)."
      - "The same with Bonferroni, p <= 0.05 / 10."
    regimes:
      same_data: "Validate on the rows the probe was fit on and the scores came from: the conventional workflow."
      held_out: "Validate on the 30% of rows never used for fitting or scoring: sample-splitting."
    fwer: >
      Fraction of B = 500 label permutations in which at least one certification occurs,
      per (scoring method, regime, variant), with Wilson 95% intervals. Fresh RNG streams
      validate_permutation (index 9) and validate_planted (index 10); existing streams untouched.
    headline: >
      The primary variant's same-data FWER, reported next to its held-out FWER. All variants
      are reported; none may replace the primary after seeing results.

  power_check:
    generator: "Stage 3 generate_planted_labels, linear form, k = 10 planted latents, 20 replicates"
    gate_amplitude: 3.0
    descriptive_amplitude: 1.0
    gate: >
      criterion_has_power holds for a regime iff, at the gate amplitude, the primary variant
      certifies in at least 80% of replicates for at least one scoring method. It must hold
      in BOTH regimes for the FWER contrast to be interpreted.

  decision_rules:
    - id: B1
      rule: >
        If the power gate fails in either regime, the FWERs of that regime are reported as
        uninformative and no statement about the workflow's false-certification rate is made
        from them.
    - id: B2
      rule: >
        No tuning to pass: alpha, k, the statistic, the variants and the gate are not changed
        after seeing results. A failure is the result; redesign needs a further amendment.
    - id: B3
      rule: >
        A valid held-out test is expected to have FWER at or below about 0.05. If the held-out
        primary FWER is clearly above that, the test or the code is wrong and this is
        investigated before any interpretation.

  expectations_not_rules:
    - "Held-out FWER at or below alpha (a valid test, conservative because removing fitted noise moves the probe toward the base rate)."
    - "Same-data FWER may exceed alpha: in-sample, any ablation moves the fit away from its optimum. If it does not, that is reported as a finding."

  interpretation_constraints:
    - >
      The joint-ablation idea was suggested by exploratory v2 results on this same data. The
      design is fixed here before the run and all permutations and planted labels are fresh
      draws, but the dataset and activation cache are the same, so this is not independent
      confirmatory evidence.
    - >
      Behavioural change is a change in a linear probe's log-loss on cached latents, not in
      the model's generated output.
    - >
      Certification rates are properties of this procedure with these settings, not of the
      field's pipeline in general.
    - >
      The search step still tests marginal association; a latent that co-fires with a true
      carrier can be selected and certified. This amendment does not address that.

# ===========================================================================
# AMENDMENT 1 - Stage 3 v2 (post-hoc; written BEFORE the v2 script exists or runs)
# ===========================================================================
# Appended; no earlier line is altered. The v1 Stage 3 block above and its results
# (results/stage3_planted_fdr.json, commits c37beee..23e3500) are kept as history. This
# amendment fixes the design of a re-run that can attribute the behaviour of Gaussian
# knockoffs to the zero atom. It is post-hoc: it follows a review of v1 and v1's own results.

stage3_amendment_1:
  meta:
    date_written: "2026-09-27"
    status: written_before_v2_ran
    ordering_note: >
      Intended to be committed with the v2 script BEFORE the full run so git history shows this
      design preceding its results. If that did not happen the results commit must say so here.
    trigger:
      - >
        v1 used s_method equicorrelated (its findings say ASDP). Stage 2 measured that S as giving
        near-copy knockoffs (corr(X_j, X~_j) about 0.977 at p = 2048; 0.970 at p = 512) and MVR as
        repairing it (0.666), and its findings said a Stage 3 baseline should use MVR. v1's power
        loss is therefore confounded with the S choice.
      - >
        v1 has no control for which Gaussian knockoffs are exactly valid, so neither its FDR nor its
        power can be attributed to the zero atom rather than to signal strength or S.
      - >
        v1 reports zero power at k = 10, q = 0.05 as a finding; Knockoff+ needs at least 1/q = 20
        discoveries, so that cell is zero by arithmetic.
      - >
        v1's amplitude sweep stops at 3.0 while FDR is still rising with amplitude, and its
        replicates within a knockoff draw share X and X~ but are treated as independent.
      - >
        v1's pre-registered Westfall-Young baseline was not implemented, and the design changed after
        the first result (single amplitude 3.0 -> sweep; 20 -> 3 x 10 replicates) with no amendment.

  design:
    latents_and_rows: >
      p = 512 latents: a seeded random subset of the 2048 retained (median Pr(X=0) 0.895, so the
      atom is representative; the top 512 by firing rate have median 0.762 and would understate it).
      n = 20000 rows: a seeded random subset. MVR did not converge at p = 2048 in 30 minutes
      (Stage 2) and does at 512; proposal Sec. 7 asks for knockoffs on the top few hundred latents
      with n/p reported (39). p differs from v1's 2048.
    datasets:
      real_mvr: "PRIMARY. Real latents, MVR S."
      real_equi: "Real latents, equicorrelated S (v1's choice): isolates the near-copy effect."
      gauss_mvr: >
        Gaussian control. X ~ N(0, Sigma) with Sigma the covariance estimated from the real
        latents, same n, same S. Gaussian knockoffs are exactly valid here up to estimation error,
        so this is the procedure with no zero atom. real_mvr vs gauss_mvr isolates the atom.
    covariance: "Stage 2 rule: Ledoit-Wolf if cond(sample) > 1e4, otherwise the sample covariance."
    knockoffs: >
      knockpy GaussianSampler. S computed once per dataset; a fresh knockoff draw for every
      replicate, so replicates are independent given X. The control reuses the primary S if
      2*Sigma - S stays positive definite, otherwise MVR is recomputed.
    signal: >
      Unchanged generator (Stage 3 generate_planted_labels): linear and pairwise-interaction forms,
      k in {10, 20, 30}, q in {0.05, 0.10, 0.20}. Amplitudes [0.5, 1, 2, 3, 5, 8]. 30 independent
      replicates per cell. Signal sets, weights and label noise are seeded per cell and shared
      across datasets, so datasets are compared on identical draws.
    filter: >
      L1-logistic lasso (FISTA, lambda 0.02) on [X, X~], W_j = |w_j| - |w~_j|, Knockoff+. Step size
      1/L with L = 0.25 * (lambda_max(Phi'Phi/n) + 1), up to 1000 iterations, with the
      proximal-gradient residual reported; the fraction of fits that hit the cap is reported.
      lambda sensitivity {0.01, 0.05} at amplitude 2.0, linear form.
    secondary_columns:
      - "Knockoff with offset 0 (separates the +1 floor from real power loss)."
      - "Westfall-Young marginal baseline (200 permutations, max |correlation|, alpha = q), scored against the CONDITIONAL truth."
      - "Cells with k < ceil(1/q) are flagged structurally zero-power and are not counted as power evidence."
    global_null_harness: "k = 0 (labels independent of X), 50 replicates per dataset: P(any discovery) is expected to be at most q."
    statistics: >
      Per cell: mean, SE (ddof = 1) over independent replicates, 95% interval. Inflated iff
      mean - 1.96*SE > q. Controlled (strict) iff mean <= q. Key contrasts: FDR and power of
      real_mvr minus gauss_mvr per cell, and real_equi minus real_mvr, with SE from independent replicates.

  decision_rules:
    - id: C1
      rule: >
        The Gaussian control must show FDR at or below q (within SE) in every cell and the k = 0
        harness must hold for it. If not, the pipeline or statistic is wrong and this is
        investigated before any interpretation.
    - id: C2
      rule: >
        A power loss is attributed to the zero atom only in cells where real_mvr power is
        significantly below gauss_mvr power at the same amplitude, k and q. Otherwise it is
        attributed to signal strength or S.
    - id: C3
      rule: >
        No tuning of lambda, S, amplitudes, cells or replicates after seeing results. A failure is
        the result; redesign needs a further amendment.

  interpretation_constraints:
    - "Planted labels are a semi-synthetic stand-in for real concepts; results are about this procedure on these latents."
    - "Same dataset and activation cache as Stage 2, so not independent of it."
    - "Realised FDR is a Monte Carlo estimate over independent replicates conditional on this X."
    - "This tests second-order Gaussian knockoffs with a fixed-lambda lasso statistic, not knockoff methods in general."

# ===========================================================================
# AMENDMENT 2 - Stage 3 p = 2048 follow-up (written BEFORE any real-data run of it)
# ===========================================================================
# Appended; no earlier line is altered. Asks why v1 reported a power collapse that v2
# (stage3_amendment_1, p = 512) does not reproduce.

stage3_amendment_2:
  meta:
    date_written: "2026-09-27"
    status: written_before_run
    ordering_note: >
      To be committed and pushed before anyone runs the p2048 experiment on real data, so git
      history shows this design preceding its results. If that did not happen, the results
      commit must say so here.
    trigger: >
      At q = 0.10, v1 (p = 2048) reported power 0.633 / 0.178 / 0.038 for linear signals at
      amplitude 0.5 with k = 10 / 20 / 30, and 0.351 for interaction signals at amplitude 1.0,
      k = 30. v2 (p = 512) found 0.900 / 0.820 / 0.503 and 0.834. The two runs differ in the
      number of latents (n/p 9.8 vs 39), the solver, the row subset and the S matrix at once,
      so the cause of the collapse is unknown.
    design_diagnostics_measured_before_writing: >
      On the real cache (first 20000 rows, p = 2048, Ledoit-Wolf, equicorrelated S) one knockoff
      draw gave lambda_max(Phi'Phi/n) = 108.4, so a safe lasso step is 1/L = 0.033; v1 used a fixed
      step of 0.1, three times the safe step, for 500 iterations with no convergence check. One
      knockpy draw at p = 2048 took about 21 s. No lasso fit on planted labels at p = 2048 was run
      before this amendment.

  design:
    fixed_to_v1: >
      p = 2048 (all retained latents), n = 20000, Ledoit-Wolf covariance, equicorrelated S (MVR
      does not converge at 2048), lambda 0.02, the unchanged label generator, amplitudes 0.5 and
      1.0 (where v1 reported the collapse), linear and interaction forms, k in {10, 20, 30},
      q in {0.05, 0.10, 0.20}.
    arms:
      v1_setup: "first 20000 rows, v1 solver (verbatim copy: step 0.1, 500 iterations). Should reproduce v1."
      first_fixed: "first 20000 rows, fixed solver (step 1/L, up to 1000 iterations, residual checked)."
      random_fixed: "seeded random 20000 rows, fixed solver."
      gauss_fixed: "Gaussian data with the random-row covariance and the same S, fixed solver: no zero atom."
      gauss_v1: "Gaussian data, v1 solver: the solver's effect without the atom."
    replicates: >
      30 per cell. Each dataset has a bank of 30 knockoff draws and replicate r uses draw r in every
      cell (a fresh draw per cell would cost about 10 hours at p = 2048). Replicates within a cell
      are independent; cells share draws; arms on the same dataset share draws and labels, so their
      contrasts are paired.
    contrasts: >
      Paired over replicates, per cell, with SE (ddof = 1): solver = first_fixed - v1_setup;
      rows = random_fixed - first_fixed; zero_atom = gauss_fixed - random_fixed;
      solver_without_atom = gauss_fixed - gauss_v1.
    reported_per_fit: "convergence (proximal-gradient residual at the safe step), non-finite fits, discoveries."

  decision_rules:
    - id: D1
      rule: >
        Reproduction check. A v1_setup cell reproduces v1 if its power is within max(2 SE, 0.10) of
        v1's reported power. v1 counts as reproduced if at least 80% of the 36 compared cells do. If
        not, that failure is reported and investigated before any attribution.
    - id: D2
      rule: >
        A factor contributes to the collapse in a cell only where its paired power contrast is
        positive and exceeds 1.96 SE. Counts over all 36 cells are reported per contrast; cells are
        not selected after seeing results.
    - id: D3
      rule: >
        Whatever power gap remains between random_fixed at p = 2048 and v2's real_equi at p = 512 is
        attributed jointly to the number of latents and the near-copy S, which this experiment
        cannot separate.
    - id: D4
      rule: "No tuning of any setting after seeing results; redesign needs a further amendment."

  interpretation_constraints:
    - "This explains a discrepancy between two runs; it is not a new estimate of knockoff FDR."
    - "Same dataset and cache as all other stages; planted labels are a semi-synthetic stand-in."

# ===========================================================================
# AMENDMENT 1 - Stage 4 hurdle knockoffs (written BEFORE any real-data run of it)
# ===========================================================================
# Appended; no earlier line is altered. meta.scope at the top of this file placed Stage 4 out
# of scope; this amendment brings the hurdle repair into scope. Stage 4's other two repairs
# (binarised knockoffs, e-value sample splitting) remain out of scope.

stage4_amendment_1:
  meta:
    date_written: "2026-09-29"
    status: written_before_run
    ordering_note: >
      Written before any real-data run of src/stage4_benchmark.py. At the user's instruction nothing
      is committed until they say so, so if this is committed together with the results, git does
      not show the ordering; it then rests on file timestamps and this statement.
    trigger: >
      Stage 3 found that Gaussian knockoffs keep FDR at or below q but lose power at p = 2048, and
      that part of that loss is due to the zero atom (Gaussian control above real latents in 11 of
      36 cells, mean +0.073; stage3_findings.md Sec. 9). Stage 4 asks whether a distribution-aware
      construction recovers that part without inflating FDR.
    deviation_from_proposal: >
      The proposal specifies hurdle knockoffs as a logistic model for Pr(X_j > 0 | X_-j) with a
      log-normal or Gamma positive part, sampled by sequential conditional independent pairs. The
      code (src/hurdle_sampler.py, by a teammate) is instead a Gaussian-copula hurdle: a randomised
      probability-integral transform maps each latent to a Gaussian, second-order knockoffs are drawn
      there, and each knockoff is mapped back through a threshold at Pr(X_j = 0) and the empirical
      positive quantiles. It is cheaper and scales to p = 2048; it is not the proposal's construction.
    code_fixes_before_run:
      - "Swap test: gradient-boosted classifier (Stage 2's) instead of a linear one, which returned AUC 0.44-0.47 on Gaussian knockoffs known to be non-exchangeable."
      - "Per-condition seeds: SeedSequence streams instead of an additive formula that gave 240 condition-replicate pairs only 120 distinct seeds."
      - "Standard errors with ddof = 1; lasso with step 1/L and a convergence check; S computed by knockpy for every method."

  design:
    setting: >
      The Stage 3 p2048 setting: the same seeded random 20000 rows (stream s3p2048_data), p = 2048,
      Ledoit-Wolf covariance, equicorrelated S, lambda 0.02. Amplitudes 0.5 and 1.0 (where the atom
      costs power) and 3.0 (to stress FDR); linear and interaction forms; k in {10, 20, 30};
      q in {0.05, 0.10, 0.20}; 30 replicates per cell.
    arms:
      gauss_real: "real latents, Gaussian second-order knockoffs (baseline; replicates the Stage 3 random_fixed arm)"
      hurdle_real: "real latents, Gaussian-copula hurdle knockoffs, equicorrelated S in latent space"
      gauss_ceiling: "Gaussian data with the real covariance, Gaussian knockoffs: the no-atom ceiling"
    pairing: >
      Each arm has a bank of 30 knockoff draws; replicate r uses draw r in every cell. gauss_real and
      hurdle_real share data and labels, so their contrast is paired; only the knockoffs differ.
    exchangeability: >
      Swap two-sample tests of Stage 2 (gradient-boosted classifier AUC and MMD permutation p-value)
      at |S| in {0, 50, all} for each arm, plus the zero-indicator accuracy. The zero-indicator is
      about 0.5 for the hurdle arm by construction and is not evidence of exchangeability.

  decision_rules:
    - id: E0
      rule: >
        Diagnostic validity. The full-swap AUC must be at least 0.90 for gauss_real (a known
        violation; Stage 2 measured 0.996) and within 0.45-0.55 for gauss_ceiling (a valid
        construction). Otherwise the swap test is not trusted and the hurdle's readout is not interpreted.
    - id: E1
      rule: >
        Hurdle exchangeability is "not detected as violated" if its full-swap AUC is at most 0.55 and
        its MMD p-value at least 0.05; otherwise it is reported as violated, and its FDR results are
        read with that in mind.
    - id: E2
      rule: >
        Validity first. The hurdle counts as a valid repair only if no cell has mean FDR - 1.96 SE > q.
        A power gain does not compensate for an FDR violation.
    - id: E3
      rule: >
        Power. A gain is claimed only in cells where the paired contrast hurdle_real - gauss_real
        exceeds 1.96 SE. Counts over all cells are reported, and the share of the no-atom gap
        (gauss_ceiling - gauss_real) that the hurdle closes is reported descriptively.
    - id: E4
      rule: >
        S confound. The hurdle's latent covariance differs from the observed one, so its equicorrelated
        S, and hence how close each knockoff is to its latent, can differ. Mean corr(X_j, X~_j) is
        reported per arm; a power gain that comes with less near-copy knockoffs is attributed jointly to
        the atom handling and the S matrix.
    - id: E5
      rule: "No tuning of any setting after seeing results; redesign needs a further amendment."

  interpretation_constraints:
    - "Planted labels are a semi-synthetic stand-in; results are for this dataset, setting and statistic."
    - "Exchangeability is only tested through necessary conditions (swap tests), never confirmed."
    - "p = 512 with MVR is not run here; there the atom cost almost no power in Stage 3, so little gain is possible."

# ===========================================================================
# AMENDMENT 2 - Stage 4 as specified in the proposal (written BEFORE any real-data run)
# ===========================================================================
# Appended; no earlier line is altered. stage4_amendment_1 tested a teammate's Gaussian-copula
# hurdle, which is not the proposal's construction; its knockoffs failed the swap test (full-swap
# AUC 0.999). This amendment builds and tests the three repairs the proposal names (Sec. 6).

stage4_amendment_2:
  meta:
    date_written: "2026-09-29"
    status: written_before_run
    ordering_note: >
      To be committed before any real-data run, at the user's instruction, so git history shows the
      design preceding its results. The run is intended for an L40S server.
    trigger: >
      Stage 3 found Gaussian knockoffs keep FDR at or below q at p = 2048 but lose power, partly
      because of the zero atom. stage4_amendment_1's copula hurdle matched zero mass per latent but
      not the joint structure. The proposal's hurdle models each latent conditionally on all the
      others, which targets exactly that structure.

  design:
    setting: >
      The Stage 3 p2048 setting: the same 20000 rows (stream s3p2048_data), all 2048 retained latents,
      Ledoit-Wolf covariance; a smaller p takes a seeded random latent subset (for local testing only).
      Amplitudes 0.5, 1.0, 3.0; linear and interaction forms; k in {10, 20, 30}; q in {0.05, 0.10,
      0.20}; 30 replicates; lasso lambda 0.02 with step 1/L and a convergence check, as in Stage 3.
    arms:
      gauss_real: "real latents, second-order Gaussian knockoffs, equicorrelated S (the Stage 3 baseline)"
      hurdle: >
        Proposal's primary repair. Knockoffs by sequential conditional independent pairs (Candes et al.
        2018): for j in index order, Pr(X_j > 0 | X_-j, X~_1..j-1) by ridge logistic regression and
        log X_j given X_j > 0 by ridge linear regression (log-normal positive part), both on
        log1p-standardised covariates; X~_j is drawn from that fitted hurdle, fresh for every replicate.
      binarised: >
        Knockoffs for Z_j = 1[X_j > 0] by the same SCIP scheme with the logistic part only; the knockoff
        filter then runs on [Z, Z~]. Avoids the atom by construction, at a cost in power.
      evalue: >
        Sample splitting with e-values (Wang and Ramdas 2022). Half A: lasso selects candidates (at most
        500). Half B: logistic regression on the selected latents gives Wald p-values, calibrated to
        e-values e = 0.5 * p^(-1/2); e-BH at level q over all p latents (unselected get e = 0).
      gauss_ceiling: "Gaussian data with the real covariance and Gaussian knockoffs: the no-atom ceiling"
    pairing: >
      All real-data arms use identical labels in each cell and replicate, so their contrasts with
      gauss_real are paired. Knockoff arms use one draw per replicate, shared across cells.
    exchangeability: >
      Stage 2's swap tests (gradient-boosted classifier AUC and MMD) at |S| in {0, 50, all} for every
      knockoff arm, with gauss_real as the known-violation control and gauss_ceiling as the valid control.

  deviations_from_proposal:
    - "SCIP uses fitted conditional models (ridge logistic and ridge log-normal regression), so it is exact only if those models are correct; its validity is checked by the swap tests, not assumed."
    - "The positive part is log-normal (the proposal allows log-normal or Gamma)."
    - "Sampled log activations are clipped to the observed range of log x_j +- 1, so extrapolated fits cannot produce activations far outside the data."
    - >
      Speed and checkpointing: each Newton fit is warm-started from the previous replicate's solution for
      the same latent (the problem is convex, so the solution is the same to within the convergence
      tolerance). The full run saves results and the warm-start state after every replicate and can
      resume; a resumed run was checked to give identical numbers to an uninterrupted one.
    - >
      The e-value arm's validity rests on the half-B logistic model being correctly specified for the
      selected latents; it is not free of distributional assumptions as the proposal states. It can fail
      when a true signal is not selected or the signal is non-linear (the interaction form).
    - "The run is at p = 2048 on a server; SCIP cost grows roughly with p cubed."

  solver_fix_after_first_runs: >
    Recorded 2026-09-30, after the first diagnose runs (pkgpu and local) and before any valid result.
    Those runs used plain Newton steps for the SCIP logistic fits. On the real loop most fits diverged
    (loss rising, steps of about 1e9, fitted firing probability collapsing to 0 because the unpenalised
    intercept's curvature falls to about 1e-10 once predictions saturate): only 20-28% converged, the
    decoys' zero mass was off by up to 0.94, and their swap tests and one-replicate pilot power/FDR were
    seen. All of those results are discarded. The fix makes the solver compute the pre-registered
    estimator: Newton with a backtracking (Armijo) line search, stopping when half the squared Newton
    decrement is below newton_tol. On the first 120 latents of the real loop it then converges in 100% of
    fits (about 8 steps) and zero mass matches to within 0.004. The models, ridge penalties, grid, arms,
    seeds and decision rules are unchanged; the e-value refit's covariance inverse falls back to a
    pseudo-inverse if the Hessian is singular.
  barber_kl_bound: >
    The proposal says a hurdle working model makes the Barber et al. (2020) KL bound numerically
    estimable. It is not estimated here: the bound needs the KL divergence between the TRUE conditional
    law of each latent and the working model, and the true law is unknown. Having an atom in the working
    model makes that divergence finite, which is what the proposal's argument needs, but finite is not
    the same as known. This is stated in the write-up instead.

  decision_rules:
    - id: F0
      rule: >
        Diagnostic validity: full-swap AUC at least 0.90 for gauss_real and within 0.45-0.55 for
        gauss_ceiling; otherwise the exchangeability readouts are not interpreted.
    - id: F1
      rule: >
        For hurdle and binarised, exchangeability is "not detected as violated" if the full-swap AUC is at
        most 0.55 and the MMD p-value at least 0.05; otherwise it is reported as violated.
    - id: F2
      rule: >
        Validity first. A repair counts as FDR-valid only if no cell has mean FDR - 1.96 SE > q. A power
        gain does not compensate for an FDR violation.
    - id: F3
      rule: >
        Power. A gain over gauss_real is claimed only in cells where the paired contrast exceeds 1.96 SE;
        counts over all cells are reported, with the share of the no-atom gap closed, descriptively.
    - id: F4
      rule: >
        Mean corr(X_j, X~_j) is reported per knockoff arm. A power gain that comes with less near-copy
        knockoffs is attributed jointly to the construction and to that similarity, not to the atom alone.
    - id: F5
      rule: "No tuning of any setting after seeing results; redesign needs a further amendment."

  interpretation_constraints:
    - "Planted labels are a semi-synthetic stand-in; results are for this dataset, setting and statistic."
    - "Exchangeability is tested only through necessary conditions (swap tests), never confirmed."

# ===========================================================================
# AMENDMENT 3 - Stage 3 follow-ups (written BEFORE either experiment ran)
# ===========================================================================
# Appended; no earlier line is altered.

stage3_amendment_3:
  meta:
    date_written: "2026-10-01"
    status: written_before_run
    ordering_note: >
      Committed and pushed before either experiment runs on real data, so git history shows this
      design preceding its results. Only local smoke tests (1 replicate, diagnose stage) precede it.
    trigger: >
      stage3_findings.md leaves three questions open. (1) Real-data FDR rises with amplitude (q = 0.10:
      0.007 at amplitude 0.5 to 0.060 at 8) while the Gaussian control stays near 0.004; the proposed
      mechanism (null latents depend on signal latents in ways Gaussian knockoffs cannot copy) is
      untested. (2) The sweep stopped at amplitude 8 with the worst cells at the nominal level, so
      whether FDR ever exceeds q is unknown. (3) At p = 2048 the power loss could not be split between
      fewer rows per latent (n/p 39 -> 9.8) and near-copy knockoffs (corr 0.50 -> 0.946), because no
      MVR S was computed at p = 2048.

  design:
    stress:
      purpose: "questions (1) and (2)"
      data: >
        The stage3_v2 latents (512), rows (20000) and Gaussian control, built by the v2 code, so the
        Gaussian arms at amplitudes 1-8 reuse v2's seeds and reproduce v2 (rule R0).
      arms:
        real_mvr: "real latents, MVR Gaussian knockoffs (v2 primary); fresh knockpy draw per fit"
        real_equi: "real latents, equicorrelated Gaussian knockoffs; fresh draw per fit"
        gauss_mvr: "Gaussian control with the real covariance, MVR knockoffs; fresh draw per fit"
        real_hurdle: >
          real latents, SCIP hurdle knockoffs with the stage4_repairs settings unchanged; a bank of 30
          draws, replicate r uses draw r in every cell (one SCIP draw takes tens of seconds). Same
          labels as real_mvr and real_equi, so contrasts with them are paired.
      grid: "amplitudes 1, 2, 3, 5, 8, 12, 20 x linear/interaction x k 10/20/30 x q .05/.10/.20, 30 replicates, lambda 0.02"
      mechanism_measurement: >
        For every fit, each null latent's link to the planted set is its max |corr| with the signal
        latents (the dataset's own sample correlation). Per link bin [0, .05, .1, .2, .3, .5, 1] the run
        records the number of nulls, of nonzero W, of positive W, the sum of W, and Knockoff+ false
        discoveries at each q. Valid knockoffs give P(W > 0 | null, W != 0) = 0.5 in every bin (the
        flip-sign property). Real vs control in the same bin isolates dependence beyond linear
        correlation, which Gaussian knockoffs copy exactly.
      secondary_statistic: >
        At lambda = 0.02 most null latents have W = 0 (neither they nor their knockoffs enter the lasso),
        so the lasso coin is measured on few nulls per fit (seen in the 1-replicate smoke test). Each fit
        therefore also records the marginal statistic |corr(y, X_j)| - |corr(y, X~_j)|, which is
        antisymmetric under swapping X_j and X~_j and so is a fair coin for every null under valid
        knockoffs. R1-R3 are evaluated on the lasso W (primary) and repeated on the marginal W (secondary,
        reported as R1_marginal etc.); conclusions rest on the primary, the secondary shows whether the
        same bias is visible in a statistic every null contributes to.
      swap_tests: "Stage 2 swap tests at |S| = 0, 50, all for all four arms at p = 512, one draw each."
    dims:
      purpose: "question (3)"
      factorial: >
        p in {512 (the v2 latents), 2048 (all retained)} x n/p in {9.77, 32.88} (p = 512: n = 5000,
        16837; p = 2048: n = 20000 = the stage3_p2048 random rows, 67349 = every cached row) x S in
        {equicorrelated, MVR} x data in {real, Gaussian control with the matching real covariance and
        the same n}. MVR at p = 2048 uses knockpy's block-diagonal approximation (blocks of at most
        512, with knockpy's line search so 2 Sigma - S stays PSD). Covariance: v2 rule at 512,
        Ledoit-Wolf at 2048. S is computed on each dataset's own covariance.
      sampler: >
        Second-order Gaussian knockoffs drawn on the GPU from the same law as knockpy's
        GaussianSampler: Xk = X - (X - mu) Sigma^-1 S + E V^(1/2), V = 2S - S Sigma^-1 S. A knockpy draw
        at p = 2048 takes about 35 s, so a fresh draw per fit is unaffordable with knockpy. The
        diagnose stage compares the two samplers' knockoff-variable correlation and cross-covariance
        error before the run.
      grid: "amplitudes 0.5, 1 x linear/interaction x k 10/20/30 x q .05/.10/.20, 30 replicates, fresh draw per fit, lambda 0.02"
      pairing: >
        Signal sets and label noise come from per-cell streams that do not depend on n, S or data,
        so at a given p the S contrast is paired (same data and labels); n and data contrasts are not.
    replicate_count_note: >
      30 replicates per experiment. If the diagnose-stage projection shows a full run cannot finish
      in time for the course deadline, the count may be lowered before the full run starts, from
      timing alone; the count used is recorded in the results.

  decision_rules:
    - id: R0
      rule: >
        Reproduction. For the three Gaussian stress arms at amplitudes 1-8, cell means are compared
        with stage3_v2_records.npz; the maximum absolute difference and the share of identical
        replicate values are reported. Differences beyond GPU floating-point noise are investigated
        before interpretation.
    - id: R1
      rule: >
        Diagnostic validity. On gauss_mvr, pooled null P(W > 0 | W != 0) must not exceed 0.5 by more
        than 1.96 SE, and no cell may be FDR-inflated. Otherwise the mechanism diagnostic is invalid.
    - id: R2
      rule: >
        Mechanism supported only if, for real_mvr at amplitudes >= 5: pooled null P(W > 0) exceeds 0.5
        by more than 1.96 SE; it is larger in the high-link bins (link >= 0.3) than in the lowest bin
        (link < 0.05) by more than 1.96 SE; and it exceeds gauss_mvr's in the high-link bins by more
        than 1.96 SE. Otherwise reported as not supported.
    - id: R3
      rule: >
        The zero atom is named as a cause only if real_hurdle FDR at amplitudes >= 5 is significantly
        below real_equi's (paired, 1.96 SE) in more than half of those cells, and its pooled null
        P(W > 0) is closer to 0.5 than real_equi's. Hurdle knockoffs are not exactly exchangeable at
        p = 2048 (Stage 4); this is stated whatever the outcome.
    - id: R4
      rule: >
        Boundary. Per arm, the smallest amplitude with any inflated cell (mean - 1.96 SE > q) is
        reported; if there is none, "no violation up to amplitude 20".
    - id: R5
      rule: >
        Dims attribution, at p = 2048 on Gaussian data: rows effect = power(n/p 32.88) - power(n/p 9.77)
        at fixed S; S effect = power(MVR) - power(equicorrelated) at fixed n. The effect significant
        (1.96 SE) in more cells, with the larger mean, is named the main driver; otherwise both are.
        The same is reported for real data, with the atom gap (Gaussian - real) at each setting.
    - id: R6
      rule: "No tuning of lambda, amplitudes, bins, S settings or cells after seeing results."

  interpretation_constraints:
    - "Planted labels are a semi-synthetic stand-in; same dataset and cache as all other stages."
    - "The link measure is linear correlation; a positive result locates the bias, it does not identify which non-Gaussian feature causes it."
    - "Block-diagonal MVR is an approximation to MVR at p = 2048; its corr(X_j, X~_j) is reported."
    - >
      The dims factorial holds the S method fixed, not the knockoff correlation: Ledoit-Wolf shrinks less
      with more rows, so equicorrelated knockoffs become more of a near-copy as n grows (smoke test at
      p = 2048: corr 0.946 at n = 20000, 0.977 at n = 67349). The rows effect is therefore reported with
      each setting's measured corr(X_j, X~_j).

# ===========================================================================
# AMENDMENT 3 - Stage 4 block-MVR Gaussian baseline (written BEFORE it ran)
# ===========================================================================
# Appended; no earlier line is altered.

stage4_amendment_3:
  meta:
    date_written: "2026-10-05"
    status: written_before_run
    ordering_note: >
      Committed and pushed before the full run. Only a local smoke test (diagnose stage, 1-2
      replicates of one cell) precedes it.
    trigger: >
      Stage 4 compared hurdle knockoffs with equicorrelated Gaussian knockoffs (mean corr(X_j, X~_j)
      0.946). The Stage 3 factorial (stage3_amendment_3, rule R5) later found that block-diagonal MVR
      knockoffs raise real-latent power at p = 2048 by 0.12 to 0.16, more than the zero atom costs.
      The hurdle's Stage 4 gain (+0.043, 77% of the atom gap) may therefore reflect a weak baseline
      and less correlated decoys (0.864) rather than modelling the zero atom.

  design:
    arms_added: >
      gauss_mvr: real latents, second-order Gaussian knockoffs with block-diagonal MVR S (knockpy
      blockdiag, blocks of at most 512, with its line search). gauss_ceiling_mvr: the Stage 4 Gaussian
      control with the same construction (S reused if 2 Sigma_g - S is PSD, else recomputed). Drawn
      with the GPU sampler of stage3_followups (same law as knockpy's GaussianSampler, checked there).
    pairing: >
      Labels come from Stage 4's per-cell streams (s4r_planted) and are identical to Stage 4's; the
      new arms get arm ids 5 and 6 in s4r_knockoff, so their knockoff draws are new and independent.
      Replicate r of a new arm is paired with replicate r of the saved Stage 4 arms
      (results/stage4_repairs_records.npz); those arms are not rerun.
    grid: "Stage 4's: amplitudes 0.5, 1, 3 x linear/interaction x k 10/20/30 x q .05/.10/.20, 30 replicates, lambda 0.02"
    contrasts: >
      hurdle_vs_mvr = hurdle - gauss_mvr; mvr_gain = gauss_mvr - gauss_real; atom_gap_mvr =
      gauss_ceiling_mvr - gauss_mvr; evalue_vs_mvr = evalue - gauss_mvr; the Stage 4 contrasts
      hurdle_gain and atom_gap are recomputed for reference. Per cell, paired SE (ddof = 1); counts are
      reported both uncorrected (1.96 SE) and Holm-corrected across the 54 cells of each contrast.

  decision_rules:
    - id: M0
      rule: >
        Reproduction. In the diagnose stage the Stage 4 gauss_real arm is rerun on the pilot cell and
        compared with the saved records; differences beyond GPU floating-point noise are investigated
        before the full run.
    - id: M1
      rule: >
        The hurdle is said to beat a well-chosen Gaussian baseline only if hurdle_vs_mvr has a positive
        mean power difference, more Holm-significant positive than negative cells, and no
        Holm-significant FDR increase. If the mean is not positive, the Stage 4 claim is restated as
        "matches block-MVR Gaussian knockoffs" (or "trails", if negative cells dominate).
    - id: M2
      rule: >
        The share of the block-MVR atom gap the hurdle closes (hurdle_vs_mvr / atom_gap_mvr, mean
        power) is reported whatever its value, with mean corr(X_j, X~_j) for each arm.
    - id: M3
      rule: "No tuning of lambda, block size or cells after seeing results."

  interpretation_constraints:
    - "Block-diagonal MVR is an approximation to MVR at p = 2048; it is a stronger baseline, not the strongest possible."
    - "The comparison is on Stage 4's planted-signal benchmark only."
  seed_fix_before_run: >
    The first full run was stopped a few minutes in, before any replicate finished, because the
    block-MVR solve was not reproducible: knockpy's MVR solver draws from numpy's global random
    state, which was unseeded (mean s 0.227 in the diagnose run, 0.252 in the stopped run, on the
    same covariance). The solve is now seeded from s4r_diagnostics (index 900). No result of the
    stopped run was seen; the design is unchanged.

# ===========================================================================
# AMENDMENT 4 - Stage 3 amplitude calibration (written BEFORE it ran)
# ===========================================================================
# Appended; no earlier line is altered.

stage3_amendment_4:
  meta:
    date_written: "2026-10-05"
    status: written_before_run
    trigger: >
      Stage 3's planted-signal amplitudes (0.5 to 20) are not tied to anything real. FDR erosion is
      strongest at amplitudes 8-20, so whether that regime is realistic decides how much it matters.
  design:
    what: >
      A descriptive calibration, no hypothesis test. In two settings (all 2048 latents and 67,349
      rows; the stage3_v2 subset of 512 latents and 20,000 rows), rows are split 60/20/20 (seeded).
      A ridge-logistic probe is fitted on the real SST-2 labels; its ridge is chosen by validation
      log-loss and then fixed. The same probe, same ridge and same split are fitted to planted labels
      (the Stage 3 generator) at amplitudes 0.25 to 20, both forms, k = 10/20/30, 3 label draws each.
    mapping_primary: >
      AUC-matched amplitude: per setting, form and k, the amplitude at which the planted labels' mean
      held-out probe AUC equals the real labels' held-out AUC (linear interpolation in log amplitude;
      reported as a bound if outside the grid).
    mapping_secondary: >
      Coefficient-norm-matched amplitude: the planted generator's coefficient vector on the k signal
      latents has L2 norm equal to the amplitude (linear form). The real probe's top-k coefficient
      norm is matched to the planted probes' top-k norms in the same way. Also reported: the planted
      labels' true (Bayes) AUC and true log-odds SD on the test rows.
  interpretation_constraints:
    - "Real labels depend on many latents, on the model's residual stream beyond the SAE, and on label noise; the planted generator does not. The mapping places real labels on the axis by one summary at a time; it is an anchor, not an equivalence."
    - "Nothing is tuned after seeing results; the ridge grid and amplitudes are fixed here."
  changes_after_smoke_test: >
    A smoke test (p512 setting, amplitudes 1 and 8, k = 10, one label draw, every third ridge value)
    ran before this amendment was committed. Its selected ridge was the largest in the grid and its
    real-label test AUC (0.934) exceeded the planted AUC at amplitude 8, so the ridge grid was
    extended to 1.0 and the amplitudes to 30 and 50, to keep both choices off the grid edge. The
    smoke test also showed the two mappings disagreeing (AUC-matched >= 8, norm-matched about 2);
    both stay as specified.

# ===========================================================================
# AMENDMENT 5 - Stage 3 large-k follow-up (written BEFORE it ran)
# ===========================================================================
# Appended; no earlier line is altered.

stage3_amendment_5:
  meta:
    date_written: "2026-10-05"
    status: written_before_run
    trigger: >
      The amplitude calibration (stage3_amendment_4) found the real SST-2 labels highly predictable
      overall (probe AUC 0.972, matched by planted amplitudes of about 5 to over 50) but spread over many
      latents (top-k coefficient norms matched by amplitudes of about 1 to 3). The Stage 3 benchmark
      plants 10-30 strong latents, so it never tested many weak signals that add up to strong overall
      predictability, which is where real labels sit.
  design:
    setting: "All 2048 latents and all 67,349 rows; Ledoit-Wolf covariance; lambda 0.02 as in Stage 3."
    arms: >
      real: real latents with block-diagonal MVR Gaussian knockoffs (knockpy blockdiag, blocks <= 512,
      solve seeded from s3k_data). gauss: Gaussian control with the same covariance and n, same S if valid.
      Fresh GPU knockoff draw per fit (stage3_followups.GaussKnockoffGPU).
    grid: "k = 100, 200, 300 x amplitudes 1, 2, 4, 8, 16, 32 x linear/interaction x q .05/.10/.20, 30 replicates."
    placement: >
      Each (amplitude, form, k) design also gets the calibration's held-out probe AUC (same split, probe
      and ridge, one label draw), so the realistic design is the amplitude whose probe AUC matches the real
      labels' 0.972 (log-linear interpolation; a bound if outside the grid).
    statistics: >
      Corrected methods only (src/reanalysis_multiplicity.py): per-cell FDR exceedance with Holm, BH and
      Benjamini-Yekutieli; per-replicate FDR-vs-log-amplitude slopes, real, control and real minus control,
      per k (Holm over the three k); pooled real-minus-control FDR per k.
  decision_rules:
    - id: K1
      rule: "The control is valid only if no control cell exceeds q after Benjamini-Yekutieli; otherwise the run is investigated before interpretation."
    - id: K2
      rule: >
        FDR erosion is said to extend to many weak signals at a given k only if the real-minus-control
        slope is positive with Holm-adjusted p < 0.05 over the three k. The real and control FDR at the
        AUC-matched (realistic) amplitude are reported for every form and k.
    - id: K3
      rule: "An FDR breach is claimed only for cells significant after Benjamini-Yekutieli."
    - id: K4
      rule: "No tuning of lambda, amplitudes, k or block size after seeing results."
  interpretation_constraints:
    - "Planted signals are random latents with equal weights; real signals may be clustered (a teammate's separate cluster experiment) and unequal."
  changes_after_smoke_test: >
    A diagnose run (one replicate of the full grid, plus the probe-AUC placement) ran before this
    amendment was committed. Its placement showed interaction designs below the real labels' AUC at
    every amplitude up to 16 (0.948-0.960), so amplitude 32 was added to bring the realistic design
    inside the grid. Its FDR and power were seen (real 0.062 / 0.461, control 0.053 / 0.500 at
    q = 0.10, averaged over all cells) and played no part in the change.
  analysis_test_before_commit: >
    After amplitude 32 was added, a 2-replicate run of the full grid tested the analysis and figure
    code; its outputs were deleted. Its interaction placements stayed at the grid edge: a linear probe
    cannot represent the interaction part of the label, so its AUC levels off below the real labels'
    value. Interaction placements are therefore reported as bounds, and the grid is not extended
    further. No setting was changed after this test.

# ===========================================================================
# AMENDMENT 6 - Stage 3 cross-validated lambda (written BEFORE either full run)
# ===========================================================================
# Appended; no earlier line is altered.

stage3_amendment_6:
  meta:
    date_written: "2026-10-05"
    status: written_before_run
    trigger: >
      Every Stage 3 and Stage 4 knockoff fit used a fixed lasso penalty (lambda = 0.02), while practice
      chooses it by cross-validation. The large-k run suggested the fixed penalty caps power when there
      are many signals (power about 0.45 at k = 300), which is the regime the real labels sit in.
  design:
    method: >
      The lasso penalty for each fit is chosen by 5-fold cross-validation (lowest held-out mean
      log-loss) over lambda_max x {0.5, 0.3, 0.2, 0.1, 0.06, 0.04, 0.02, 0.01, 0.005, 0.0025}, with
      lambda_max computed on the augmented design [X, X~]; the knockoff statistic is unchanged
      (W = |w_j| - |w~_j|, Knockoff+). The choice is symmetric in each variable and its knockoff, so W
      keeps the flip-sign property. Folds come from a per-cell stream (s3cv_folds).
    pairing: >
      The cells are regenerated with the saved runs' seeds (stage3_stress, stage3_largek): identical
      labels and identical knockoff draws. CV-lambda results are paired replicate by replicate with the
      saved fixed-lambda records; the fixed fits are not rerun.
    parts:
      stress: "p = 512 (v2 data, knockpy MVR knockoffs, Gaussian control); amplitudes 1, 5, 20; both forms; k = 10, 20, 30; 30 replicates."
      largek: "p = 2048, all rows, block-MVR knockoffs; the realistic designs only: amplitudes 8 (linear) and 32 (interaction), both forms, k = 100, 300; 10 replicates."
    replicate_note: >
      The large-k replicate count (10, against 30 elsewhere) was set from timing alone: each CV fit at
      p = 2048 and n = 67,349 needs about 50 lasso fits, and one replicate took over 20 minutes on a
      laptop GPU. If a timing check on the server projects the full large-k run beyond 10 hours, the
      count may be lowered before the full run starts, from timing alone; the count used is recorded.
  decision_rules:
    - id: L0
      rule: "Reproduction: a fixed-lambda refit of one cell per arm must match the saved records exactly (checked in diagnose; held for the stress part before this commit)."
    - id: L1
      rule: "FDR breaches at CV lambda are claimed only for cells significant after Benjamini-Yekutieli; the control arm must show none."
    - id: L2
      rule: >
        Per part and arm, the paired pooled differences CV minus fixed (power, FDR) are reported with
        two-sided p-values; the Stage 3 conclusions are said to depend on the penalty if the real-minus-
        control FDR difference changes sign or loses significance (p >= 0.05) at CV lambda, or, in the
        stress part, if the real-minus-control FDR trend in amplitude does.
    - id: L3
      rule: "The CV-chosen lambda (median ratio to lambda_max) and the share of fits at a grid edge are reported; an edge share above 25% is stated as a limitation, not fixed by rerunning."
    - id: L4
      rule: "No tuning after seeing results."
  changes_after_smoke_test: >
    Two diagnose runs of the stress part (one replicate each) preceded this commit; they reproduced the
    saved records exactly (L0). In the first, 17-28% of CV choices sat at the smallest grid value (0.01 x
    lambda_max), so the grid was extended to 0.0025 x lambda_max (edge share then 0-6%). Their FDR and
    power were seen only as averages printed by the pilot (power 1.0 at q = 0.10 for both arms) and
    played no part in the change. A large-k diagnose run on a laptop did not finish its first replicate
    before the machine overheated; it produced no results.

# ===========================================================================
# AMENDMENT 4 - Stage 4 repairs under the cross-validated penalty (written BEFORE it ran)
# ===========================================================================
# Appended; no earlier line is altered.

stage4_amendment_4:
  meta:
    date_written: "2026-10-06"
    status: written_before_run
    trigger: >
      Under the cross-validated lasso penalty (stage3_amendment_6), Gaussian knockoffs on real latents
      exceeded the FDR target after Benjamini-Yekutieli correction in the realistic many-weak-signal
      designs (12 cells, all interaction; the control none). Every Stage 4 comparison used the fixed
      penalty, where nothing breached, so FDR could not separate the repairs. Hurdle knockoffs had lower
      FDR than block-MVR Gaussian knockoffs at the fixed penalty (0.013 vs 0.023) but less power.
  design:
    data: "Stage 4's: p = 2048, n = 20,000 (stage3_p2048 rows), Ledoit-Wolf, seeded block-MVR S (stage4_amendment_3)."
    cells: "The realistic designs from stage3_largek: k = 100, 300 x amplitudes 8, 32 x linear/interaction x q .05/.10/.20; 10 replicates; labels from a new stream (s4cv_planted)."
    arms: >
      hurdle (SCIP, the stage4_repairs settings), gauss_real (equicorrelated), gauss_mvr (block MVR),
      gauss_ceiling_mvr (Gaussian control, block MVR). Knockoff draws use Stage 4's stream and arm ids;
      the hurdle runs in its own group (one SCIP draw per replicate, about 14 min on the server).
    penalty: >
      Every fit is done twice on the same knockoff draw and labels: at the fixed lambda (0.02) and at the
      5-fold CV lambda of stage3_amendment_6 (same grid relative to lambda_max of [X, X~], lowest held-out
      log-loss; folds from s4cv_folds). Fixed and CV results are therefore paired.
  decision_rules:
    - id: C1
      rule: "The block-MVR Gaussian control must show no FDR breach after Benjamini-Yekutieli at CV lambda; otherwise the run is investigated before interpretation."
    - id: C2
      rule: "Breaches (Benjamini-Yekutieli, per arm over its 24 cells) are reported for every arm at both penalties."
    - id: C3
      rule: >
        Hurdle knockoffs are said to restore FDR control under the CV penalty only if, at CV lambda, the
        hurdle arm has no Benjamini-Yekutieli breach and its FDR is significantly below gauss_mvr's (paired
        pooled test, p < 0.05). The paired power difference (hurdle - gauss_mvr) is reported either way.
    - id: C4
      rule: "No tuning after seeing results; the CV-lambda grid-edge share is reported (above 25% is a stated limitation)."
  interpretation_constraints:
    - "Same planted-signal benchmark and dataset as Stages 3-4; 10 replicates (timing)."
