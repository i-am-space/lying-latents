# PRE-REGISTRATION — Stage 2 exchangeability audit
#
# Frozen before any experiment was run. Committed as its own commit so the git
# timestamp precedes the first results commit. Every threshold, seed and decision
# rule below was fixed in advance. If any of it is changed later, the change must
# be a separate commit with a stated reason, and the original must remain in history.
#
# The paper's thesis is that the field selects on its own results. This file is the
# evidence that we did not.

meta:
  stage: 2
  date_registered: "2026-09-04"
  scope: >
    Activation cache, distributional summary, Gaussian second-order knockoff
    generation, exchangeability diagnostics with a validated null harness.
    Stages 1, 3, 4 and 5 are out of scope and are not built.

# ---------------------------------------------------------------------------
# Seeds
# ---------------------------------------------------------------------------
seeds:
  master: 20260904
  # Per-component streams are derived deterministically from the master seed via
  # numpy.random.SeedSequence(master).spawn(), in this fixed order. Do not reorder.
  streams:
    - dataset_order      # 0
    - torch_global       # 1
    - knockoff_sampler   # 2
    - row_partition      # 3
    - classifier         # 4
    - mmd_permutation    # 5
    - synthetic_null     # 6

# ---------------------------------------------------------------------------
# Data / model / SAE  (verified to resolve before registration)
# ---------------------------------------------------------------------------
data:
  dataset: glue
  dataset_config: sst2
  split: train
  n_expected: 67349          # full split, no subsampling
  text_column: sentence
  label_column: label

model:
  name: google/gemma-2-2b
  dtype: float32
  layer: 20
  hook: resid_post           # HF hidden_states[layer+1]
  attn_implementation: eager # required for correct Gemma-2 logit soft-capping

sae:
  release: gemma-scope-2b-pt-res-canonical
  sae_id: layer_20/width_16k/canonical
  d_sae: 16384
  architecture: jumprelu

# ---------------------------------------------------------------------------
# Aggregation  (see NOTES_reference.md §2 and §7)
# ---------------------------------------------------------------------------
aggregation:
  primary: mean
  cached:
    - mean          # mean over non-special tokens
    - max           # max over non-special tokens
    - last          # last non-special token (defensible analogue of the reference)
  exclude_tokens: [pad, bos, eos]
  rationale: >
    The build instructions make max primary only if the reference uses max. It does
    not: it takes position -1 of a right-padded batch, which is a pad token for most
    rows (verified, NOTES_reference.md §2.1). Mean therefore stays primary. `last` is
    cached so their intended aggregator can be reported separately from their padding
    bug. The reference's literal [:, -1, :] is not reproduced.

# ---------------------------------------------------------------------------
# High-activity latent filter
# ---------------------------------------------------------------------------
latent_filter:
  statistic: firing_rate       # Pr(X_j > 0) across the corpus
  min_firing_rate: 0.01
  max_retained: 2048           # top-p by firing rate if more survive
  applied_on: primary_aggregator
  note: >
    The reference instead takes top-1024 by mean |activation| ("energy"). That
    statistic is recorded per latent so the two selections can be compared, but it
    is not used for selection here.

# ---------------------------------------------------------------------------
# DECISION RULE 1 — premise check (Deliverable 2)
# ---------------------------------------------------------------------------
# Evaluated on median_j Pr(X_j = 0) over RETAINED latents, exact zeros only,
# under the PRIMARY aggregator. Reported for every aggregator regardless.
premise_check:
  statistic: median_zero_mass_retained_primary
  rules:
    - if: ">= 0.80"
      verdict: PREMISE_HOLDS
      action: proceed to the exchangeability audit as specified
    - if: "0.50 <= x < 0.80"
      verdict: PREMISE_WEAKENED
      action: >
        proceed, but the writeup must state that the atom argument rests on a
        smaller atom than the >0.95 figure claimed in the proposal, and must report
        the realised value in place of that claim.
    - if: "< 0.50"
      verdict: PREMISE_FAILS
      action: >
        stop. Report the number. The atom argument needs rewriting around the
        aggregator before any further work is committed.

# ---------------------------------------------------------------------------
# DECISION RULE 2 — covariance conditioning
# ---------------------------------------------------------------------------
covariance:
  estimators: [sample, ledoit_wolf]   # both always reported
  ill_conditioned_if_cond_number_above: 10000.0
  primary_selection_rule: >
    If cond(sample covariance of standardised columns) > 1e4, ledoit_wolf is primary
    and sample is reported alongside. Otherwise sample is primary.
  standardise_columns_before_construction: true
  also_run_unstandardised: true       # exposes the reference's scale confound

# ---------------------------------------------------------------------------
# Knockoff construction
# ---------------------------------------------------------------------------
knockoffs:
  library: knockpy
  sampler: knockpy.knockoffs.GaussianSampler
  s_method_primary: equicorrelated    # matches the reference's scalar-s construction
  s_method_secondary: mvr
  sample_tol: 1.0e-05

# ---------------------------------------------------------------------------
# DECISION RULE 3 — harness validation (§7.2). Runs BEFORE the real diagnostics.
# ---------------------------------------------------------------------------
# Synthetic data: multivariate Gaussian with the SAME covariance as the real
# retained latents. Second-order knockoffs are exactly valid there, so every
# diagnostic must return null. If any fires, the harness is broken.
synthetic_null:
  n_rows: 20000
  n_replicates: 10
  pass_criteria:
    classifier_auc_ci95_must_contain: 0.50
    mmd_pvalue_uniformity_ks_test_p_min: 0.05   # KS test of the 10 p-values vs U(0,1)
    max_abs_standardised_moment_gap: 0.10
  on_failure: >
    Fix the harness. Do not run the real diagnostics. A diagnostic that fires on
    exactly-valid Gaussian knockoffs would produce a result that looks like a
    finding and is not.

# ---------------------------------------------------------------------------
# Diagnostics (§7.3)
# ---------------------------------------------------------------------------
diagnostics:
  # (a) zero-mass discrepancy — the trivial classifier 1{x = 0}
  zero_mass:
    expected_under_exchangeability: 0.50
    report: distribution across retained latents

  # (b) swap two-sample tests
  swap:
    subset_sizes: [0, 1, 10, 50, "all"]   # |S| = 0 is the built-in negative control
    row_partition: 0.5                     # half unswapped, half swapped
    classifier:
      model: sklearn.ensemble.HistGradientBoostingClassifier
      max_iter: 100
      holdout_fraction: 0.3
      null_band_from: label_permutation
      n_permutations: 20
    mmd:
      kernel: gaussian
      bandwidth: median_heuristic
      subsample_per_group: 2000
      n_permutations: 500

  # (c) higher moments and tails
  moments:
    must_match: [mean, variance]           # matched by construction; if not, misconfigured
    match_tolerance_relative: 0.05
    compared: [skewness, kurtosis, q90, q99, q999, max]

# ---------------------------------------------------------------------------
# DECISION RULE 4 — what counts as a violation
# ---------------------------------------------------------------------------
violation_criteria:
  zero_mass: "median per-latent accuracy of 1{x=0} > 0.55"
  swap_auc: "held-out AUC exceeds the |S|=0 null band's 97.5th percentile"
  moments: "skewness or kurtosis gap exceeds the synthetic-null gap by >5x"

# ---------------------------------------------------------------------------
# Interpretation constraints — fixed in advance, must survive into the paper
# ---------------------------------------------------------------------------
interpretation_constraints:
  - >
    The null set is unknown on real data. Exchangeability is only REQUIRED on nulls.
    These are therefore necessary-condition tests: sufficient to falsify, not to
    confirm. We may not claim to have "confirmed the violation on nulls".
  - >
    A violation of exchangeability VOIDS the guarantee. It does not demonstrate that
    realised FDR exceeds the target. That is Stage 3 and is out of scope. No
    conclusion may assert demonstrated FDR inflation from Stage 2 evidence.
  - >
    The zero-mass diagnostic is deliberately the simplest possible falsification. Its
    force is that it needs no test at all, only the definition. It must not be
    oversold as a sophisticated finding.
  - >
    The reference's padding bug and its unstandardised scalar-s covariance scaling are
    defects of that implementation. They are reported SEPARATELY from the zero-atom
    argument, which is a defect of the Gaussian surrogate itself and would survive a
    correct implementation.

# ===========================================================================
# PRE-REGISTRATION — Stage 1 FWER calibration
# ===========================================================================
# Appended to the same pre-registration file. All Stage 2 rules above are
# unchanged. This block must be committed before any Stage 1 results.

stage1:
  meta:
    date_registered: "2026-09-10"
    scope: >
      FWER calibration of the standard search-then-validate pipeline under the
      global null (label permutation). Reuses the Stage 2 activation cache;
      no new GPU work. All analysis is CPU-bound.

  seeds:
    stream: label_permutation   # index 7 in STREAMS (appended, preserving 0-6)

  n_permutations: 500

  scoring_methods:
    mean_diff:
      definition: "|mean(X_j | y=1) - mean(X_j | y=0)| on the train split"
    auroc:
      definition: >
        |AUC(y, X_j) - 0.5| on the train split, computed via the rank-sum
        (Mann-Whitney U) formula. Ties broken by stable sort order.
    probe_weight:
      definition: >
        |β_j| from L1-logistic regression on all retained latents, train split.
        Columns standardised (zero mean, unit variance) before fitting.

  selection:
    top_k: 10
    note: >
      Top-10 matches a realistic practitioner use case (pick a handful of
      candidates). The scoring method determines the ranking.

  validation:
    method: latent_zeroing
    description: >
      Zero the candidate latent's column in X_test, re-evaluate the logistic
      probe's held-out accuracy. If accuracy drops by >= delta, the latent is
      "certified" (passes the search-then-validate workflow).
    ablation_delta: 0.02
    note: >
      This is a latent-space proxy for model-level ablation. True model-level
      ablation would require a forward pass per candidate per permutation
      (500 * k = 5000 GPU forward passes), which is out of scope. The proxy
      is faithful to the logic of the standard pipeline: a latent is certified
      iff it both ranks highly AND zeroing it changes predictions.
    probe:
      penalty: l1
      solver: saga
      C: 1.0
      max_iter: 200
    holdout_fraction: 0.3

  fwer_definition: >
    Fraction of B permutations in which at least one latent is certified.
    Reported separately for each scoring method.

  westfall_young:
    description: >
      The permutation null distribution of max_j score(j, y_π) across all B
      permutations. Single-step Westfall-Young correction. Per-latent adjusted
      p-values: p_j = (1 + #{b : max_null_b >= real_score_j}) / (1 + B).
    alpha: [0.05, 0.01]

  interpretation_constraints:
    - >
      FWER under the global null measures how often the pipeline falsely
      certifies ANY feature when no feature carries signal. It is a property
      of the selection and validation procedure, not of the data.
    - >
      The Westfall-Young correction provides a multiplicity-adjusted threshold
      usable independently of the knockoff framework.
    - >
      A high FWER does not by itself prove that published feature claims are
      wrong. It shows that the pipeline does not control the error rate it
      implicitly claims to control. Analogous to demonstrating that a
      confidence interval has the wrong coverage: the parameter may still
      be in the interval, but the guarantee is void.

# ===========================================================================
# PRE-REGISTRATION — Stage 3 Realised FDR on Planted Ground Truth
# ===========================================================================
# Appended to the same pre-registration file. All Stage 1 and Stage 2 rules
# above remain unchanged. This block must be committed before Stage 3 results.

stage3:
  meta:
    date_registered: "2026-09-19"
    scope: >
      Evaluate realised False Discovery Rate (FDR) and statistical power of
      Gaussian second-order knockoffs on semi-synthetic ground truth. The real
      activation matrix X is retained (preserving exact zero-mass and correlation
      structure) while synthetic task labels Y are generated from a known subset
      S of true signals. All latents outside S are conditionally null by construction.

  seeds:
    stream: planted_signal      # index 8 in STREAMS

  signal_sizes: [10, 20, 30]
  nominal_fdr_targets: [0.05, 0.10, 0.20]
  replicates_per_condition: 20

  functional_forms:
    linear:
      description: "Logits = X_S * beta, where beta_j has random signs (+/- 1) with magnitude normalized"
    interaction:
      description: "Logits = X_S * beta + sum_{pairs} gamma_ij * X_si * X_sj with pairwise non-linear interactions"

  model_fitting:
    loss: "L1-penalised logistic regression (Lasso)"
    penalty_parameter: "cross-validated or fixed regularisation path"
    knockoff_statistic: "W_j = |beta_j| - |beta_tilde_j|"
    filter_rule: "Knockoff+ threshold (offset = 1)"

  baseline_comparison:
    method: "Westfall-Young max-statistic correction from Stage 1"
    description: "Benchmark whether assumption-free permutation testing achieves FDR control and what power it yields"

  decision_rules:
    fdr_controlled: "Mean realised FDR <= nominal target q + 1.96 * SE"
    fdr_inflated: "Mean realised FDR > nominal target q + 1.96 * SE"

  interpretation_constraints:
    - >
      Planted signal semi-synthetic benchmark isolates the effect of the
      discrete-continuous zero atom on FDR control while preserving true feature correlations.
    - >
      If realised FDR exceeds nominal q, the exchangeability violation is proven
      to cause practical harm in scientific feature discovery.
    - >
      If realised FDR tracks nominal q, the Gaussian surrogate is empirically
      robust despite mathematical misspecification.


