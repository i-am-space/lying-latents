# Concept-dilution branch — amendments. Same format as config/preregistration.yaml.
# Written and committed BEFORE any labelled run of Steps 1, 6, 7 or 8. Label-free work done before
# this commit (caches, the family census on the widths then available, layer-20 candidates and
# S solves) is disclosed under changes_before_registration.

concept_amendment_1:
  meta:
    date_written: "2026-10-05"
    status: written_before_run
    branch: concept-dilution
    plan: CONCEPT_DILUTION_PLAN.md
    thesis: >
      Per-latent feature discovery tests the wrong unit. As the dictionary widens, a concept is carried
      by more latents (dilution: children fire on disjoint inputs, per-child standardised signal ~ 1/sqrt(m);
      redundancy: near-duplicate children, each conditionally null given the others). Prediction:
      per-latent discovery degrades with width; concept-level (group) discovery does not.

  design:
    model_sae: "Gemma-2-2B residual stream. Width sweep at layer 12 (16k, 32k, 65k, 131k, 262k, 524k, 1M);
      layer-20 bridge (16k, 65k) to the main project. Canonical Gemma Scope SAEs except 131k at layer 12,
      which exists only in gemma-scope-2b-pt-res: average_l0_129 is used, chosen by Gemma Scope's own
      canonical rule (L0 closest to 100). Mean L0 on SST-2 content tokens is logged per width as a confound."
    data: "SST-2 train, all 67,349 sentences, mean over content tokens (BOS/EOS/pad excluded), as the main cache."
    step1_toy:
      sizes: {n: 20000, p: 1024, K_planted_concepts: 20, pi_concept_fires: 0.05}
      m: [1, 2, 4, 8, 16, 32]
      mechanisms: "dilution (exactly one child fires, log-normal sigma 0.75) and redundancy (all children
        co-fire, child = a * exp(N(0, 0.1^2)))"
      flavours: "zinf (zero-inflated, the proposition) and gauss (Gaussian with family-block correlation
        0.3 / 0.95, where second-order knockoffs are exactly valid: the unit test of the library)"
      labels: "c_g = standardise(sum of children); generate_planted_labels(C, arange(K), linear, amp)"
      amplitudes: [1, 3, 8]
      replicates: 50
      null_replicates_gauss: 200
      why_K20_not_1: "Knockoff+ needs >= 1/q discoveries; one planted concept gives zero power by arithmetic."
    step3_census:
      taus: [0.3, 0.4, 0.5, 0.6, 0.7]
      child_floor: 0.001
      mechanism: "multi-child family: redundancy if mean pairwise child correlation >= 0.9; dilution if
        mean co-firing Jaccard < 0.2 and correlation < 0.9"
    step4_candidates:
      p_star: 2048
      pool: "seeded random 16k reference parents whose families exist at every width of the layer, union at
        the widest width <= p*/2; target 60 parents, minimum 40"
      groups: "primary: parent family; sensitivity: average-linkage decoder-cosine clusters cut at 1 - tau;
        both capped at 64 latents"
      labels_never_read: true
    step5_library: "BlockGaussKnockoff (full block-diagonal S), knockpy group MVR (method='mvr' explicit,
      blockdiag, max_block 512, seeded), group W = sum|beta| - sum|beta~|, MKF(c)+ per Katsevich & Sabatti
      (2019) Algorithm 1 with c = 1 (primary) and c = 1.93 (guaranteed). Each layer has its own knockoff draw.
      Lasso: FISTA L1-logistic, lambda 0.02, max_iter 1000, tol 1e-4, as Stage 3."
    step6_gate:
      grid: {design: B, arms: [latent], K_c: [20, 30], amplitudes: [1, 3, 8], forms: [linear, interaction], replicates: 10, q: 0.1}
      real: "per-latent discoveries at q = 0.1, median over 10 knockoff draws; Jaccard of discovered parent sets vs 16k"
    step7_planted:
      widths: "all layer-12 widths and the layer-20 bridge"
      designs:
        A: "exact truth: c_g = standardise(sum of the concept's children at that width)"
        B: "realistic: c_g = standardise(the 16k parent's activation), identical across widths (paired);
            latent-level FDR is approximate here"
      grid: {K_c: [20, 30], amplitudes: [0.5, 1, 2, 3, 5, 8, 20], forms: [linear, interaction], q: [0.05, 0.10, 0.20], replicates: 30}
      arms: [latent, group, cluster, mkf_c1, mkf_c1.93]
      concept_counting: "a concept (16k parent family) is discovered when >= 1 of its latents is selected"
      knockoff_draws: "one fresh draw per (width, arm, replicate), shared by all label columns of that
        replicate (as the main repo's p = 2048 draw banks); replicates use independent draws"
    step8_real: {draws: 30, q: [0.05, 0.10, 0.20], stable_frequency: 0.5,
      stability: "Jaccard of stable 16k-parent sets between every width pair; primary on planted-pool
      families (identical parents at every width), secondary on all families"}

  decision_rules:
    - id: TAU
      rule: "tau is frozen from the full layer-12 census before Step 6 as the tau in the grid that minimises,
        over layer-12 widths, the maximum |log(median sum-of-children firing / parent firing)| (children
        best cover their parent); ties go to the larger tau. The plan's wording ('the smallest tau where
        summed firing tracks parent firing') is ambiguous because smaller tau always admits more children;
        this is the operationalisation. tau is not changed afterwards."
    - id: C0
      rule: "If the median family size at the widest width is 1 for every tau, stop and report."
    - id: T1
      rule: "Library unit test (gauss flavour): under the global null, P(any discovery) <= q at both layers
        for latent, group and MKF(1.93); in planted gauss cells, no FDR breach after Benjamini-Yekutieli.
        If T1 fails the library is investigated before Steps 6-8 are interpreted."
    - id: G1
      rule: "Per replicate, per-latent concept recovery at q = 0.1 averaged over (form, K_c); least-squares
        slope vs log2(width) over the 7 layer-12 widths; one-sided t-test of mean slope < 0 per amplitude;
        Holm across the three amplitudes. Proceed to Step 7 only if at least one Holm-adjusted p < 0.05.
        Otherwise stop: the thesis is wrong at this layer."
    - id: P1
      rule: "Step 7 contrast (i): per arm and cell, paired-over-replicates slope of concept power vs
        log2(width); significance after Benjamini-Yekutieli across cells."
    - id: P2
      rule: "Step 7 contrast (ii): group minus per-latent concept power, paired over replicates, per width
        and cell; Benjamini-Yekutieli across cells."
    - id: P3
      rule: "Step 7 contrast (iii): an FDR breach (latent or concept level) is claimed only for cells
        significant after Benjamini-Yekutieli (one-sided, mean FDR > q), as main-repo rule K3."
    - id: P4
      rule: "The thesis is supported at a layer if per-latent concept power has BY-significant negative
        slopes in design B while group concept power does not, or group minus per-latent power is
        BY-significantly positive and grows with width. Mixed results are reported as mixed."
    - id: NT
      rule: "No tuning of lambda, amplitudes, K_c, tau, p*, pool size or block size after seeing labelled results."

  interpretation_constraints:
    - "Gaussian knockoffs on zero-inflated latents are approximate (Stage 2); FDR results are empirical."
    - "Design B: the 16k parent's signal may not be fully carried by its wide-SAE children within the
       candidate set (children below tau, below the firing floor, or capped at 64). A fall in GROUP power
       with width in design B therefore mixes coverage loss with dilution; design A has no coverage loss."
    - "Canonical SAEs differ in L0 across widths; L0 is logged and is a confound for width effects."
    - "Layer 12 is not the main project's layer 20; the 16k/65k layer-20 bridge links the two."
    - "The clustering arm is a sensitivity analysis; the plan notes a teammate's separate cluster
       experiment (stage3_amendment_5) that has not been checked against this one."

  changes_before_registration:
    - "Residuals stored fp32, not fp16 as planned: the plan's own reproduction check needs 1e-4 agreement,
       and fp16 rounding of norm-350 residuals would flip JumpReLU gates."
    - "Reproduction check (label-free) ran: the plan's criterion (max |diff| < 1e-4) FAILED. Max |diff|
       1.705; 5,829 of 137,930,752 entries exceed 1e-4; of these 14 are JumpReLU threshold flips (|diff| x
       n_tokens ~ threshold) and the rest are fp32 rounding on large activations (max relative diff
       6.6e-5, median 4.9e-6; max abs diff excluding flips 3.6e-4); 7 zero-pattern mismatches; token
       counts identical; the 1% firing filter keeps 7,696 latents in both. Recorded in
       concept/results/check_reproduction.json. Interpreted as the same pipeline up to float roundoff."
    - "Family census diagnose on layer-12 16k/32k/65k (label-free): C0 already passes at 65k (median
       family 2 at tau <= 0.4); multi-child families 92% dilution, 0% redundancy at tau 0.5."
    - "Layer-20 bridge candidates and S solves built with provisional tau = 0.5 (label-free); rebuilt if TAU
       freezes elsewhere."
    - "GPU driver faults on this host (intermittent cuInit failures): GPU jobs initialise CUDA with retries
       and are requeued on failure. No effect on results."

  changes_after_smoke_test:
    - "Diagnose pass (2026-10-05 ~17:25): layer-20 bridge, one replicate of the full Step 7 grid and two
       real-label draws per width. Single-replicate concept power and FDR per cell were seen."
    - "Observed and now an interpretation constraint (no setting changed): in design B the concept-level
       FDR is 0.2-0.6 at 65k for every arm, because wide latents outside the 16k parent's family also carry
       the parent's signal and are conditionally non-null. Design B truth is approximate at BOTH levels, not
       only the latent level as planned. FDR claims (rule P3) therefore rest on design A only; design B is
       reported for power and width trends."
    - "Code only: design A's concept sums are computed from the standardised matrix without a dense float64
       copy (identical to 7e-15); --draws/--tag overrides for the real sweep. No setting changed."
    - "Timing: about 34 s per replicate per width for the whole grid and 3 fitted arms; about 2 min to load a
       width; 100% lasso convergence."

concept_amendment_2:
  meta:
    date_written: "2026-10-05"
    status: written_before_run
    trigger: >
      Step 1 (toy) result: under REDUNDANCY, group knockoffs keep concept power at 1.00 for every m up to
      32 while per-latent power collapses (amplitude 3: 1.00, 0.73, 0.01 at m = 2, 4, 8). Under DILUTION,
      group power collapses together with per-latent power (amplitude 3: 0.89 at m = 8, 0.00 at m = 16),
      although the per-child effect falls as 1/sqrt(m) exactly as predicted. The pre-registered prediction
      "group power is flat in m" therefore FAILS for dilution. MKF+ tracks per-latent in both mechanisms
      (a latent must pass both layers). Library test T1 passed (0 breaches in 288 null and 864 planted
      Gaussian cells).
    hypothesis: >
      The dilution failure is a property of the importance statistic, not of group knockoffs: the
      coordinate-wise L1 penalty shrinks each diluted child to zero before W_g sums them.
  design:
    arm: group_sum
    statistic: >
      Lasso (same FISTA, lambda 0.02, no tuning) on [s, s~], s_g = sum_{j in g} Z_j, s~_g = sum_{j in g} Z~_j,
      each pair scaled by the same constant sqrt((var s_g + var s~_g)/2); W_g = |b_g| - |b~_g|. Swapping a
      whole group swaps s_g and s~_g, so W is a valid group knockoff statistic (unit-tested).
    knockoffs: "the group arm's own draws (identical seeds), so group_sum vs group is paired on identical
      knockoffs and labels"
    toy: "EXPLORATORY (post hoc, motivated by the result above): same toy data, labels and draws; Gaussian
      flavour null and planted cells re-check validity (rule T1 applied to this arm)."
    real_benchmark: "CONFIRMATORY, registered here before it runs: the group_sum arm runs inside the Step 7
      run itself (the main run had not started), on the same widths, grid, replicates, labels and
      group-arm draws; the other arms are unaffected (verified: a one-replicate rerun reproduces every
      existing arm's numbers exactly). It is also added to the Step 8 real sweep, using the group arm's draws."
    toy_result: "S1 passed: 0 BY-significant FDR breaches in 432 planted toy cells (max mean FDR 0.000) and
      no discovery in any Gaussian global-null replicate; concept power 1.00 at every m, both mechanisms,
      every amplitude (exploratory, and favourable by construction: toy labels are functions of the group sum)."
  decision_rules:
    - id: S1
      rule: "group_sum is interpreted only if it passes T1 on the Gaussian toy (no BY-significant FDR breach)."
    - id: S2
      rule: "Step 7 follow-up: paired group_sum minus group and group_sum minus latent concept power per width
        and cell, Benjamini-Yekutieli across cells; slope of group_sum concept power vs log2(width) as P1.
        FDR breaches as P3 (design A only)."
  interpretation_constraints:
    - "The toy comparison is exploratory: it was designed after the dilution result was seen."
    - "A sum statistic assumes children act in the same direction; signed or mixed children could cancel."

concept_amendment_3:
  meta:
    date_written: "2026-10-06"
    status: written_before_run
    purpose: >
      Make the group-sum statistic the primary method and test it confirmatorily on independent layers,
      with designs that remove its advantage-by-construction (design A labels are literal family sums).
    seen_before_writing:
      - "All layer-12 and layer-20 results of concept_amendment_1/2 (concept_findings.md). The primary
         endpoint below was chosen from layer-12 data: design A, weak amplitudes {0.5, 1, 2}, q = 0.1,
         where group_sum - latent concept power at 1M was +0.073 (p = 5e-14) and its slope +0.012 per
         doubling (p = 7e-17); design B showed no effect (-0.017). Layer 12 is therefore NOT independent
         evidence for this amendment; layers 19 and 5 are."
      - "One regression replicate on layer-20 65k (designs A-D, all arms) to check the code: existing arms
         reproduced the full run exactly. Seen (concept power, K_c 20, linear, q 0.1, amps 0.5/1/2):
         design D group_sum 0.50/0.70/0.75 vs group_lasso 0.80/1.00/1.00; design A group_sum 0.70/1/1 vs
         group_lasso 0.90/1/1. One replicate; the primary statistic is NOT changed because of it."
  design:
    primary_statistic: "group_sum: lasso (lambda 0.02) on within-family sums [s, s~] (amendment 2)"
    challenger: "group_lasso: unweighted logistic group lasso (lambda 0.02) on [Z, Z~], each family and its
      knockoff family a group; W_g = ||b_g||_2 - ||b~_g||_2. Sign-robust pooling. Same FISTA, same draws."
    baselines: [latent, group, mkf_c1, mkf_c1.93]
    dropped: "cluster arm (its family-level FDR is a unit mismatch; amendment 1 findings)"
    knockoff_draws: "group, group_sum and group_lasso all use the group arm's draw (identical knockoffs)"
    layers:
      primary_replication: "layer 19: 16k (average_l0_73), 65k (average_l0_115), 1M (average_l0_88)"
      secondary_replication: "layer 5: 16k (average_l0_68), 65k (average_l0_105), 1M (average_l0_114)"
      consistency: "layer 12 rerun with designs A-D and all arms (A/B reproduce the earlier run exactly)"
    tau: "fixed at 0.3 (not re-derived per layer); child floor, p*, pool and group caps unchanged"
    designs:
      A: "c_g = standardise(sum of children)"
      B: "c_g = standardise(16k parent activation) (approximate truth)"
      C: "c_g = standardise(sum_j w_j X_j), w_j ~ U(0.5, 1.5) per child, replicate and width"
      D: "c_g = standardise(sum_j w_j X_j), w_j = +-1 at random (mixed signs)"
      truth: "every child of a planted family is non-null in A, C, D"
    grid: "unchanged: K_c {20, 30}, amplitudes {0.5, 1, 2, 3, 5, 8, 20}, linear and interaction, q {0.05, 0.1, 0.2}, 30 replicates"
    real_sweep: "arms latent, group, group_sum, group_lasso; 30 draws; stability = Jaccard of stable parents
      (selected in >= 50% of draws, q 0.1) between 16k and 1M, restricted to parents in both candidate sets"
  primary_endpoint: >
    Per replicate: concept power (a planted family counts as found if >= 1 of its latents is selected) at
    q = 0.1, averaged over K_c, forms and amplitudes {0.5, 1, 2}; design A.
  decision_rules:
    - id: R1
      rule: "Layer 19: mean over replicates of (group_sum - latent) at 1M > 0; one-sided paired t-test."
    - id: R2
      rule: "Layer 19: per-replicate least-squares slope of (group_sum - latent) vs log2(width) > 0; one-sided t-test."
    - id: R12
      rule: "Holm across R1 and R2. The fix REPLICATES at layer 19 iff both Holm-adjusted p < 0.05."
    - id: R3
      rule: "Safety: design A, group_sum concept-level FDR at q = 0.1 has no Benjamini-Yekutieli-significant
        breach (one-sided, mean > q) across all layer-19 cells. Required for success."
    - id: R4
      rule: "Layer 5: R1 and R2 as above, Holm across the two. Both pass = the fix GENERALISES across layers."
    - id: R5
      rule: "Layer 12 rerun: R1 and R2 (consistency only; not independent)."
    - id: T1G
      rule: "group_lasso is interpreted only if it passes T1 on the Gaussian toy (no BY-significant breach,
        null and planted cells)."
    - id: SEC
      rule: "Secondary, BY within each family of tests: the R1/R2 statistics for designs B, C, D and for
        group_lasso vs latent and group_lasso vs group_sum (all designs); latent-level power at 1M; real-label
        stability group_sum vs latent."
    - id: NT
      rule: "No tuning of lambda, tau, amplitudes, grid, p*, pool or block size."
  predictions:
    - "C: group_sum > latent (positive unequal weights still add up)."
    - "D: group_sum loses much of its advantage (signed children cancel); group_lasso > group_sum."
    - "A and C: group_lasso between latent and group_sum (its pooled signal is m-invariant but its noise
       grows like sqrt(m) under dilution)."
    - "B: no reliable difference between pooled and per-latent arms (coverage loss dominates)."
  outcomes:
    success: "R12 passes at layer 19 and R3 holds"
    strong_success: "success and R4 passes at layer 5"
    failure: "R1 fails at layer 19"
    otherwise: "partial; reported as such"
  interpretation_constraints:
    - "The endpoint was chosen on layer 12; layer-12 results are consistency checks, not confirmation."
    - "Design A favours a sum statistic by construction; designs C and D are the test of generality."
    - "Three widths per replication layer: the slope test has little leverage, so R1 carries most weight."
